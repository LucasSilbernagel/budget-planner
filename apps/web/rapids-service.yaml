# Documentation, not the deploy input: the Rapids CLI takes flags and nothing applies
# this file. Fields with no CLI flag are set by hand at provisioning.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: budget-planner-web
  labels:
    app: budget-planner
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "5"
        autoscaling.knative.dev/target: "80"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 60
      containers:
        # The pipeline deploys an immutable :<commit-sha> tag; `latest` is illustrative.
        - image: cr.danubedata.ro/budgetplanner795/budget-planner-web:latest
          ports:
            - name: http1
              containerPort: 8080 # must equal $PORT
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # /api/health has no DB dependency, so scale-from-zero is not gated on the DB.
          readinessProbe:
            httpGet:
              path: /api/health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: production # unset defaults to development, which fails open on the session secret
            - name: PORT
              value: "8080"
            # Runtime secrets are injected as Rapids platform secrets, never committed here.
