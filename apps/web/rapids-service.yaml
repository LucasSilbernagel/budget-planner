# DanubeData Rapids (Knative Serving) service definition — budget-planner web.
# Story 5-2, AC-2. Region: Falkenstein, Germany (EU only) — NFR1/NFR2,
# full CLOUD Act immunity. Serves SSR + /api/* + dist/client/ from one
# self-listening container (apps/web/server-entry.mjs, AC-1).
#
# ⚠️⚠️ THIS FILE IS DOCUMENTATION, NOT THE DEPLOY INPUT. Story 4-16 read the
# DanubeData CLI's own source (@danubedata/cli 1.1.0) and found that Rapids is
# driven by a REST API through flag-based commands — `danube rapids apply` takes
# --name/--image/--tag/--port/--health-check-path/--profile/--min-scale/
# --max-scale and has NO manifest (`-f`) option at all. Nothing applies this
# YAML. It survives as the reviewable statement of intended runtime shape, and
# because several of its fields have no CLI equivalent and must be set by hand.
#
# What the pipeline DOES assert on every deploy (.github/workflows/deploy.yml):
#   image + tag, port 8080, health-check path /api/health, min-scale, max-scale.
#
# What has NO CLI flag and is therefore set ONCE at provisioning, by hand, and
# silently drifts from this file if anyone changes it in the console:
#   - env vars / runtime secrets (only `rapids update --env` sets these, and it
#     would put every secret in a CI process argument list — inject them in the
#     console instead; see DEPLOY-RAPIDS.md §3)
#   - containerConcurrency, timeoutSeconds, the autoscaling target
#   - CPU/memory requests+limits (the CLI exposes only --profile, whose valid
#     names are undocumented — passing a guess would fail the whole rollout)
#   - livenessProbe (the CLI sets the READINESS path only)
#   - auto-TLS domain mapping (cluster/domain level, not a per-service field)
#
# Region is enforced by creating the account/project in Falkenstein, not by any
# value in this file. 4-17 confirmed the live database sits in `fsn1`
# (Falkenstein, DE) via `danube db ls`.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: budget-planner-web
  labels:
    app: budget-planner
  # ⚠️ A `danubedata.com/region: falkenstein-de` annotation used to sit here. It
  # was REMOVED by 4-16, not corrected: the key was an unverified guess AND it
  # named the wrong vendor domain — DanubeData's real domain is `danubedata.ro`
  # (the CLI's own image example is `cr.danubedata.ro/<ns>/api`, and the DB host
  # allowlist in packages/db/src/client.ts records that no real host has ever
  # matched `.danubedata.com`). Swapping .com for .ro would only have replaced
  # one guess with another, on a file nothing applies. Region comes from where
  # the project lives, and that is already verified.
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0" # scale-to-zero → ~€0 idle cost
        autoscaling.knative.dev/max-scale: "5" # cap fan-out (cold-start + cost aware)
        autoscaling.knative.dev/target: "80" # soft target: concurrent reqs/instance
    spec:
      containerConcurrency: 100 # hard per-instance ceiling
      timeoutSeconds: 60 # max request duration
      containers:
        # Host + namespace corroborated three ways: the CLI's own example
        # (`cr.danubedata.ro/<ns>/api`), DEPLOY_RUNBOOK.md §1's DANUBEDATA_REGISTRY
        # row, and the namespace in the live DB FQDN 4-17 verified
        # (`budget-planner-prod-rw.budgetplanner795.svc.cluster.local`).
        # The pipeline always deploys an immutable :<commit-sha> tag; `latest`
        # here is illustrative only.
        - image: cr.danubedata.ro/budgetplanner795/budget-planner-web:latest
          ports:
            - name: http1
              containerPort: 8080 # must equal $PORT (server-entry.mjs default)
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Liveness/readiness use /api/health (Story 5-5): a process-up check
          # with NO database dependency, so scale-from-zero is not gated on the
          # DB. /api/ready performs the deeper dependency check (for monitoring,
          # Story 5-5) and is intentionally NOT the scale-up gate.
          readinessProbe:
            httpGet:
              path: /api/health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: production # explicit — unset defaults to development (fail-OPEN session secret)
            - name: PORT
              value: "8080"
            # --- Runtime secrets: injected as Rapids platform secrets, NEVER ---
            # --- committed here. See apps/web/DEPLOY-RAPIDS.md for the full   ---
            # --- inventory + generation commands (AC-3). Coordinate injection ---
            # --- once across 5-2 / 4-16 / 4-17 / 5-3.                          ---
            # DATABASE_URL, DATABASE_CA_CERT (optional), SESSION_SECRET,
            # SITE_URL, PADDLE_ENVIRONMENT, PADDLE_VENDOR_ID, PADDLE_API_KEY,
            # PADDLE_PUBLIC_KEY, PADDLE_WEBHOOK_SECRET, EMAIL_API_KEY, EMAIL_FROM.
