<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Longhand Budget">
  <rect width="32" height="32" rx="7" fill="#16a34a"/>
  <!-- The "L" of Longhand, and nothing else (story 40.2 / UX-DR44).

       ⚠️ SIMPLICITY HERE IS A REQUIREMENT, NOT A STYLE PREFERENCE, AND IT WAS
       SETTLED BY LOOKING AT A REAL BROWSER TAB. An earlier revision of this
       mark ran the L's foot on into a rising chart tick, to keep the
       budget/growth meaning the 6-5 arrow carried. It measured fine — 3.30:1
       contrast, 2 solid device pixels of stroke — and it still read as a smudge
       at 16x16, because the diagonal competes with the letter instead of
       supporting it. Lucas rejected it on sight in the tab strip. Every number
       this file's guard reports is a FLOOR; none of them can tell you the mark
       is legible, which is why AC-8 asks a person. Do not reintroduce a second
       element here without checking it the same way.

       ⚠️ The geometry is pixel-grid aligned ON PURPOSE, not merely tidy. At
       16x16 the viewBox scales by 0.5, so the stem (centred x=10, width 4)
       covers device px [4,6) — columns 4 and 5, two whole pixels — and the foot
       (centred y=22) covers rows [10,12). Both therefore render as solid white
       rather than four grey anti-aliased half-pixels. Square terminals keep the
       ends on the same boundaries: a round cap would give back a fraction of a
       pixel at each end. Moving a coordinate by an odd amount, or thinning the
       stroke below 4 units (= 2 device px at 16x16), gives that crispness up —
       `src/__tests__/favicon-assets.test.ts` fails if it does. -->
  <path d="M10 8 V22 H20"
        fill="none" stroke="#ffffff" stroke-width="4"
        stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
