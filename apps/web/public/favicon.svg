<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Budget Planner">
  <rect width="32" height="32" rx="7" fill="#16a34a"/>
  <!-- Upward growth / budget-trend arrow (a rising "B" line). Bold, single
       high-contrast stroke so the mark stays legible down to 16x16. The line
       runs up into the arrowhead, which caps it so the two read as one arrow. -->
  <path d="M7 22 L13 16 L18 19 L23.5 12"
        fill="none" stroke="#ffffff" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18.5 10.5 L25.5 10.5 L25.5 17.5 Z" fill="#ffffff"/>
</svg>
