  17-1-prompt-users-that-the-app-can-be-installed-as-a-pwa: done  # CODE-REVIEWED 2026-07-09 (bmad-code-review, 3 adversarial layers on claude-opus-4-8 — SAME model per Lucas's call; review → done). Acceptance Auditor: ALL 4 ACs PASS + every hard constraint PASS (SSR-safe, no any, focus:ring-2 width, green-not-red, bottom-16 sm:bottom-4 above fixed nav, localStorage swallow, 30-day interval, apps/web-only). 1 decision + 4 patch APPLIED (Lucas apply-all), 2 deferred, 3 dismissed. DECISION (resolved → scope-to-focus): Escape-to-dismiss was a GLOBAL window keydown that also wrote 30-day suppression (spec Task 3 says "when the affordance HOLDS FOCUS") → now gated on affordanceRef.current.contains(document.activeElement), so an Escape meant for unrelated UI never dismisses/suppresses. PATCHES: (1) wasRecentlyDismissed now rejects FUTURE/clock-skewed timestamps (dismissedAt > Date.now()) — a finite future ts gave negative delta < interval = suppress ~forever, Number.isFinite alone missed it; (2) beforeinstallprompt handler RE-CHECKS isRunningStandalone()||wasRecentlyDismissed() per-event (listener is lifetime deps:[], so a same-session re-fire after dismissal no longer re-shows); (3) reload e2e now asserts the persisted localStorage value directly (single post-reload fire could pass by MISSING the event, not proving persistence); (4) 320px e2e now asserts vertical clearance (region.bottom <= nav.top via getByRole('navigation',{name:'Primary'})), not just horizontal bounds. DEFERRED (in deferred-work.md): early beforeinstallprompt-before-hydration lost w/ no replay (effect-attach timing, SSR tradeoffs, practically mitigated by deferred SW reg); a11y polish beyond AC-4 (announce-on-appearance + focus-restore-on-dismiss). DISMISSED: prompt()-reject swallow (correct one-shot handling, benign retry), userChoice-never-resolves (theoretical, UI already hidden), dismiss-btn styling vs literal ConfirmDialog (reasonable "(×)" reading, ring preserved). GATES GREEN post-patch: web vi