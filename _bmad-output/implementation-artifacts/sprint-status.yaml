  ux-1-ssr-resolve-session-tier-to-remove-first-paint-flash: done  # 2026-07-14 CODE-REVIEWED (bmad-code-review 3-layer adversarial, all claude-opus-4-8 same-model per Lucas: Blind Hunter · Edge Case Hunter · Acceptance Auditor) → ✅ all 5 ACs PASS. Triage: 2 decision-needed + 3 patch + 3 dismissed. D1 (email/tier now in SSR HTML → cache leak) → PATCH: setResponseHeader private,no-store when authenticated. D2 (staleTime:Infinity stale-tier on non-invalidate changes) → ACCEPTED (sign-out already invalidates+refreshes seed; residual is parity/presentation-only, server-enforced). 4 patches APPLIED: (P1) seedToStatus fail-closed on isAuthenticated + guard test; (P2) getSessionSeed returns null on resolver error → self-heal via client check + preserves ThemeProvider's dark-pref !error guard + logging; (P3) fixed misleading comments (resolveSessionSeed name, "null on client nav"); (P4) cache-control. Dismissed (verified/inert): e2e retry-click "gate bypass" (button not anchor; theme spec still asserts no dark), dehydration-mismatch (empirically verified no hydration warnings), userId??'' (unused in strip). Gates re-run green: Biome clean (275), unit 696 pass (+1 guard test), tsc net-zero-new (217==217), build green, Playwright 63 pass/3 skip, AC-5 re-verified (setResponseHeader server-only, dist/client clean). Reusable lesson: with createServerFn+staleTime:Infinity a fail-closed seed that collapses ERROR into signed-out (error:null) silently defeats downstream !error guards (ThemeProvider dark-pref) AND removes self-heal — return null on error so consumers fall back to the client check. Original dev entry follows.  # 2026-07-14 dev-story DONE (claude-opus-4-8), all 5 ACs met, ready for code-review. baseline 2c0ce5e. Resolve session+tier ONCE server-side in the __root.tsx loader via `getSessionSeed` (a createServerFn) + `staleTime: Infinity`, feeding a new SessionSeedProvider (context/session-seed.tsx) consumed as an INITIAL SEED by AuthIndicator (seedToAuthState) + usePremiumAccess (seedToStatus, skips on-mount checkAccess when seeded) → first painted frame already correct (no neutral→content flip). KEY: had to use createServerFn (NOT the raw dynamic-import pattern) — the root loader context has no `request`, and getRequest() from @tanstack/react-start/server is blocked by TanStack Start's import-protection plugin in any route's client-reachable graph; createServerFn extracts the handler to the server bundle. AC-5 verified (no framework server entry in dist/client; import-protection passes). Auth strip keeps its per-nav /api/auth/me refetch (AC-4); premium liveness = pre-UX-1 (presentation gate, server-enforced, corrects on reload). Gates: Biome clean (275), unit 695 pass (94 files, +1 new hooks/__tests__/usePremiumAccess.test.tsx + auth-indicator SSR-seed block), tsc net-zero-new (217==217, all pre-existing debt), build green, Playwright 63 pass/3 skip. SSR smoke on / (signed-out): auth strip emits resolved `<a href=/login>Sign in</a>` (not h-4 w-24 placeholder) + premium cards emit premium-gate-locked (not -skeleton). Two e2e (premium-locked, theme-dark-mode) updated to retry-click: the now-SSR-painted locked control is clickable in the brief pre-hydration window (test-timing artifact, not a product bug — manual repro opens the prompt). Pre-existing paddle-in-dist/client (usePremiumAccess Buffer gap) confirmed via git-stash baseline = NOT introduced here. NEXT: code-review (recommend a different LLM).
