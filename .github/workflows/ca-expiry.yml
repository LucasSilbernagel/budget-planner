# Weekly warning: the pinned DATABASE_CA_CERT does not renew with the cluster's
# 90-day chain, and a lapsed copy reads as a database outage.
name: CA certificate expiry

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Keep in lockstep with deploy.yml's NODE_VERSION.
env:
  NODE_VERSION: '24'

jobs:
  check:
    name: Check DATABASE_CA_CERT expiry
    runs-on: ubuntu-latest
    # Environment-scoped secret: without the environment it resolves to empty.
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check certificate expiry
        env:
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          CA_EXPIRY_WARN_DAYS: '21'
        run: pnpm --filter @budget-planner/db db:ca-expiry
