name: Mirror base images

# Copies the two upstream base images into this account's GHCR namespace. The packages are
# public, so CI pulls them anonymously without ECR Public's rate limit (it throttled 5 deploys).

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  MIRROR: ghcr.io/lucassilbernagel/mirror

jobs:
  mirror:
    name: Mirror ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['node:24-slim', 'postgres:18']
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Single platform: multi-arch needs one upstream request per manifest; runners are amd64.
      # mirror.gcr.io backs up ECR, whose anonymous data cap is per (shared) runner IP.
      - name: Copy ${{ matrix.image }} from upstream
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          dst="${MIRROR}/${IMAGE}"
          for attempt in 1 2 3; do
            for registry in public.ecr.aws/docker mirror.gcr.io; do
              src="${registry}/library/${IMAGE}"
              if docker pull -q --platform linux/amd64 "${src}"; then
                docker tag "${src}" "${dst}"
                docker push -q "${dst}"
                docker buildx imagetools inspect "${dst}"
                exit 0
              fi
            done
            echo "attempt ${attempt} failed on every registry; retrying in $((attempt * 60))s"
            sleep $((attempt * 60))
          done
          echo "::error::pulling ${IMAGE} failed after 3 attempts"
          exit 1
