name: Mirror base images

# Copies the two upstream base images into this account's GHCR namespace. CI pulls from
# GHCR with GITHUB_TOKEN, which has no anonymous rate limit; ECR Public throttled 5 deploys.

on:
  push:
    branches: [ci/ghcr-base-image-mirror]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  MIRROR: ghcr.io/lucassilbernagel/mirror

jobs:
  mirror:
    name: Mirror ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['node:24-slim', 'postgres:18']
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # imagetools copies the full multi-arch manifest list registry to registry; nothing is pulled locally.
      - name: Copy ${{ matrix.image }} from ECR Public
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if docker buildx imagetools create \
                --tag "${MIRROR}/${IMAGE}" \
                "public.ecr.aws/docker/library/${IMAGE}"; then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::mirroring ${IMAGE} failed after 4 attempts"
              exit 1
            fi
            echo "attempt ${attempt} failed (throttled?); retrying in $((attempt * 60))s"
            sleep $((attempt * 60))
          done
          docker buildx imagetools inspect "${MIRROR}/${IMAGE}"
