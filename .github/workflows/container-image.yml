name: Container image (PR check)

# Runs the same size budget and serve + migrate checks as deploy.yml's build-image,
# on PRs. Pushes nothing and reads no secrets.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch to build instead of this one (e.g. 913ab34 for the pre-slim baseline). Nothing is pushed.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: budget-planner-web

jobs:
  container-image:
    name: Container image (build, size budget, serve + migrate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check out the tree to build
        if: ${{ inputs.ref != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: target

      - name: Build production image
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ctx=.
          if [ -n "${REF}" ]; then ctx=target; fi
          echo "Building $(git -C "${ctx}" rev-parse HEAD)"
          docker build -f "${ctx}/apps/web/Dockerfile" -t "${IMAGE_NAME}:check" "${ctx}"

      - name: Check the image size budget
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          docker image inspect "${IMAGE_NAME}:check" --format 'uncompressed .Size: {{.Size}} B'
          docker pull -q public.ecr.aws/docker/library/node:24-slim > /dev/null || true
          mode=""
          if [ -n "${REF}" ]; then mode="--report-only"; fi
          docker save "${IMAGE_NAME}:check" | python3 .github/scripts/image_size.py --base public.ecr.aws/docker/library/node:24-slim ${mode}

      - name: Verify the image serves and migrates
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ctx=.
          if [ -n "${REF}" ]; then ctx=target; fi
          bash .github/scripts/verify-image.sh "${IMAGE_NAME}:check" "${ctx}/packages/db/migrations/meta/_journal.json"
