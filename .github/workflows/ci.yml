name: CI

# Quality-gate pipeline (Story 4-15).
#
# Runs the three required checks on every PR into `main`. Each gate is an independent job so it surfaces as its own required
# status check in GitHub branch protection (see .github/BRANCH_PROTECTION.md):
#   - lint        → pnpm biome check . (+ tsconfig validation)
#   - unit-tests  → pnpm test:unit (Vitest, all workspaces)
#   - e2e-tests   → pnpm test:e2e  (headless Playwright / Chromium)
#
# `validate:tsconfig` (config-file sanity only) runs inside the lint job.
#
# The full `tsc` type-check is NOT run here — it is a *deploy* gate, owned by
# `deploy.yml` (Story 5-4, AC-1). The original reason for excluding it (a tracked
# backlog of pre-existing type errors) is dead: the strict-TS sweep closed
# 2026-08-24 and every package now reports 0 errors. It sits on the deploy path
# rather than here so this workflow's three job names stay exactly the three
# required status checks documented in .github/BRANCH_PROTECTION.md.
#
# Deployment is intentionally out of scope here; it is owned by the Epic 5
# production stories (5-4 configure CI/CD for production, 4-16/4-17 deploy).

on:
  pull_request:
    branches: [main]
  # NO `push: main` trigger, on purpose. Every push to `main` already runs these
  # exact gates through `deploy.yml` (below), so a standalone push run duplicated
  # ~8 minutes of runner time per push. Removed 2026-09-15. Required status
  # checks are evaluated on the PR, which this trigger still covers, and a push
  # that bypasses a PR still cannot deploy without passing the nested run.
  #
  # Story 5-4: lets `deploy.yml` invoke these exact gates as a `needs:`
  # dependency, so the deploy job structurally cannot start unless lint, unit
  # and e2e all pass. The job names are unchanged, so the required status checks
  # in BRANCH_PROTECTION.md keep their names.
  workflow_call:

# Supersede in-flight runs for the same ref so pushes don't pile up CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the checked-out code.
permissions:
  contents: read

env:
  # Pin Node to match local dev: .nvmrc (Node 20, engines >=20.12.0).
  # pnpm version is NOT pinned here - it comes from the `packageManager` field
  # in package.json (pnpm@10.34.3), which pnpm/action-setup reads automatically.
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint (Biome + tsconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version is read from the `packageManager` field in package.json
        # (single source of truth). Do NOT also pass `version:` here - pnpm
        # action-setup errors on a conflict (ERR_PNPM_BAD_PM_VERSION).
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome check .

      - name: Validate tsconfig files
        run: pnpm validate:tsconfig

      # 5-4 wrote these invariants; nothing ran them. A deploy-pipeline guard
      # that only executes when someone remembers to type it is not a guard, and
      # every property it protects (branch confinement, DEPLOY_ENABLED gating,
      # least privilege, "no step echoes a secret") is one careless edit from
      # gone. Wired into the lint gate by 4-16 so an edit to deploy.yml is
      # checked on every PR.
      - name: Validate deploy-workflow invariants
        run: python3 scripts/validate-deploy-workflow.py

      # Story 58.1 (AC-9). `getSessionSeed` carries a dev-only override that
      # fabricates an entitled session from E2E_SESSION_SEED so Playwright can
      # measure the paid nav. It is gated on `import.meta.env.DEV`, which Vite
      # replaces at build time, so a production build should not contain it at
      # all.
      #
      # "Should" is the reason this step exists. The unit guard
      # (`session-seed-dev-seam.guard.test.ts`) asserts the SOURCE SHAPE and
      # cannot see the bundle; a change to how the server bundle is produced
      # could stop eliminating the branch while every test stays green. This
      # builds the real thing and greps it.
      #
      # ⚠️ The positive control is not optional. A grep that finds nothing
      # because it searched the wrong directory looks exactly like a pass, so we
      # first assert a string that MUST be present.
      - name: Dev-only session seam is absent from a production build
        run: |
          set -euo pipefail
          pnpm --filter web build
          if ! grep -rq "getSessionSeed" apps/web/dist/; then
            echo "::error::Positive control failed - 'getSessionSeed' not found in apps/web/dist/."
            echo "The grep is not reaching the build output, so a clean result would prove nothing."
            exit 1
          fi
          if grep -rq "E2E_SESSION_SEED" apps/web/dist/; then
            echo "::error::SECURITY: the dev-only session seam survived into the production build."
            grep -rn "E2E_SESSION_SEED" apps/web/dist/ || true
            exit 1
          fi
          echo "OK: positive control present, E2E_SESSION_SEED absent from apps/web/dist/."

  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version is read from the `packageManager` field in package.json
        # (single source of truth). Do NOT also pass `version:` here - pnpm
        # action-setup errors on a conflict (ERR_PNPM_BAD_PM_VERSION).
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No package pre-build needed: vitest aliases @budget-planner/* to their
      # TypeScript source (apps/web/vitest.config.ts), so tests run against src.
      # External services (Paddle) are mocked via MSW; the db client
      # connects lazily, so no real database is required (NFR8).
      - name: Run unit tests
        run: pnpm test:unit

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version is read from the `packageManager` field in package.json
        # (single source of truth). Do NOT also pass `version:` here - pnpm
        # action-setup errors on a conflict (ERR_PNPM_BAD_PM_VERSION).
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium binary + its OS deps are not part of `pnpm install`. The binary
      # is cached per Playwright version; the OS packages live outside the cache
      # directory, so they are installed on a hit too.
      - name: Resolve Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version=$(pnpm --filter @budget-planner/web exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @budget-planner/web exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @budget-planner/web exec playwright install-deps chromium

      # Playwright boots the app itself (webServer: `pnpm dev`). GitHub Actions
      # sets CI=true automatically, which enables one retry + 4 workers and
      # disables dev-server reuse (see apps/web/playwright.config.ts).
      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
