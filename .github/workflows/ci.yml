name: CI

# Job names are the required status checks in branch protection; keep them stable.

on:
  pull_request:
    branches: [main]
  # No push trigger: deploy.yml runs these gates on every push to main.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pnpm's version comes from package.json `packageManager`.
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint (Biome + tsconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # No `version:` here: it conflicts with package.json `packageManager`.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome check .

      - name: Validate tsconfig files
        run: pnpm validate:tsconfig

      - name: Comment rules
        run: pnpm lint:comments

      - name: Validate deploy-workflow invariants
        run: python3 scripts/validate-deploy-workflow.py

      # Dev-only seams are gated on import.meta.env.DEV; unit tests see only source,
      # so scan the real build to prove they were eliminated.
      - name: Dev-only seams and server-only code are absent from the build
        run: |
          set -euo pipefail
          pnpm --filter web build

          node apps/web/scripts/check-client-bundle.mjs

      # Runs after the build: routeTree.gen.ts is gitignored and only the build emits it.
      - name: Knip (unused code)
        run: pnpm knip

  unit-shards:
    # The matrix length must equal the /N in --shard, or files are silently dropped.
    name: Unit tests (Vitest) shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # No `version:` here: it conflicts with package.json `packageManager`.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The package-local binary so --shard reaches Vitest itself; a misparsed flag
      # would run 0 files (or all) while the job stays green.
      - name: Run web unit tests (shard ${{ matrix.shard }}/2)
        run: cd apps/web && ./node_modules/.bin/vitest run --config vitest.config.ts --shard=${{ matrix.shard }}/2

      # `!cancelled()` so a web failure in shard 1 still reports core and db.
      - name: Run core unit tests
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: pnpm --filter @budget-planner/core test:unit

      - name: Run db unit tests
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: pnpm --filter @budget-planner/db test:unit

  unit-tests:
    # The required check. `always()` because a skipped required check counts as
    # passing; only an explicit "success" from the shards passes.
    name: Unit tests (Vitest)
    needs: unit-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All unit-test shards passed
        env:
          SHARDS_RESULT: ${{ needs.unit-shards.result }}
        run: |
          echo "unit-shards result: ${SHARDS_RESULT}"
          test "${SHARDS_RESULT}" = "success"

  e2e-tests:
    name: E2E tests (Playwright)
    # Pinned to the image screenshots.yml renders baselines on; change both together.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # No `version:` here: it conflicts with package.json `packageManager`.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # OS packages live outside the browser cache, so they are installed on a hit too.
      - name: Resolve Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version=$(pnpm --filter @budget-planner/web exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @budget-planner/web exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @budget-planner/web exec playwright install-deps chromium

      # Runs every project, including the CI-only screenshot projects: never add
      # `--project`/`--grep` here.
      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
