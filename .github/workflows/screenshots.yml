name: Screenshots

# The only place baselines are made: CI renders system-ui as DejaVu Sans, dev boxes
# as Noto Sans. runs-on must match ci.yml's e2e-tests job.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'update (write baselines) or compare (check against them)'
        required: true
        default: compare
        type: choice
        options: [compare, update]

# Not cancel-in-progress: a compare dispatched right after an update would lose its baselines.
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  screenshots:
    name: Screenshots (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version=$(pnpm --filter @budget-planner/web exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @budget-planner/web exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @budget-planner/web exec playwright install-deps chromium

      - name: Run the screenshot projects
        working-directory: apps/web
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # An API dispatch bypasses the `choice` list.
          case "$MODE" in
            update | compare) ;;
            *) echo "::error::unknown mode '$MODE' (expected update or compare)"; exit 1 ;;
          esac
          args=(--project=screenshots --project=screenshots-paid)
          if [ "$MODE" = update ]; then
            rm -rf e2e/__screenshots__
            args+=(--update-snapshots=all)
          fi
          ./node_modules/.bin/playwright test "${args[@]}"

      - name: Upload the baselines
        if: ${{ inputs.mode == 'update' }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines
          path: apps/web/e2e/__screenshots__/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-report
          path: apps/web/playwright-report/
          retention-days: 7
