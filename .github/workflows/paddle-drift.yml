# Weekly check that the Paddle.js internals copied into paddle-js-internals.ts still
# match the unversioned CDN file. Exit 2 = could not run; exit 1 = drift.
name: Paddle.js drift

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# The script imports a .ts file via Node's type stripping (Node >= 22.18).
env:
  NODE_VERSION: '24'

jobs:
  check:
    name: Check paddle.js for drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check paddle.js
        run: node apps/web/scripts/check-paddle-drift.mjs
