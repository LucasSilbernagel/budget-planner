name: Deploy (production)

# Production deploy pipeline (Story 5-4).
#
# THE SINGLE deploy workflow for this repo. Story 4-16 was originally assigned
# `deploy.yml`'s authorship but had not created it (sprint-change-proposal
# 2026-06-26 §4.1); 5-4 owns it now. Do NOT add a second deploy workflow —
# 4-16 should harden this file instead.
#
# Division of labour:
#   - ci.yml (4-15) ...... the three quality gates. Invoked here, never rebuilt.
#   - 5-2 ................ the runtime: server-entry.mjs, Dockerfile, rapids-service.yaml.
#   - 4-17 ............... the managed PostgreSQL instance itself.
#   - THIS FILE .......... gating, build, migration, deploy, rollback, smoke.
#
# TRIGGER (AC-1) — push to `main`, plus manual dispatch.
#   `main` is the release branch: every merge into it is a candidate release.
#   (Branch protection is documented in .github/BRANCH_PROTECTION.md but is
#   admin-applied, so whether it is actually ON is not knowable from the repo —
#   which is exactly why this workflow re-runs the gates itself rather than
#   trusting that a PR already ran them.) A tag/release trigger was considered and NOT
#   chosen: it adds a manual ceremony step for a single-maintainer pre-launch
#   project without adding a safety property that the `production` Environment
#   (AC-5) does not already provide. `workflow_dispatch` covers the cases a push
#   trigger cannot: re-deploying without a code change, and ROLLBACK (dispatch
#   with `image_tag` set to a previous known-good SHA — see DEPLOY_RUNBOOK.md).
#
# ⚠️ BLOCKED-ON-ACCOUNT. The steps that talk to DanubeData cannot be written
# blind: the registry path, the deploy CLI/API and the revision model are not
# public (ADR-001 flags Rapids as thinly documented). They are gated behind the
# `DEPLOY_ENABLED` repository variable and are deliberately built to FAIL LOUDLY
# rather than no-op: a pipeline that reports success without deploying is worse
# than one that is honestly switched off. Everything before them — the gates,
# the type-check, the image build — runs for real on every push today.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy. Defaults to this run''s commit SHA. Set to an earlier SHA to ROLL BACK.'
        required: false
        type: string

# One production deploy at a time, and NEVER cancel one in flight: a cancelled
# run between the migrate and deploy jobs is exactly how a database ends up
# ahead of the code that serves it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  IMAGE_NAME: budget-planner-web
  # Pinned deliberately: the `migrate` job's safety depends on `rapids
  # apply`/`update`/`rm` behaving exactly as expected, and the `deploy` job's on
  # `rapids apply --wait`, so the CLI does not float underneath the pipeline.
  #
  # `DB_INSTANCE` lived here until Story 5.18 for the sole purpose of naming the
  # instance to `danube db dns enable`/`disable`. No step opens a public database
  # endpoint any more, so nothing in this workflow addresses the database
  # instance by name — only the app reaches it, over internal DNS.
  DANUBE_CLI_VERSION: '1.3.0'

jobs:
  # --- Gate 1: the existing quality checks (AC-1) ----------------------------
  # Calls ci.yml as a reusable workflow, so lint + unit + e2e must ALL pass
  # before anything downstream starts. Expressed as a `needs:` dependency rather
  # than `workflow_run` on purpose: `workflow_run` fires on failure too and only
  # blocks if you remember to test `conclusion == 'success'`, which makes "a red
  # build never deploys" a convention. Here it is structural.
  #
  # ci.yml no longer has a `push: main` trigger (removed 2026-09-15), so on a
  # push to `main` these gates run exactly once — here. They previously ran
  # twice, once per workflow. The job names are unchanged, so the required
  # status checks on PRs still resolve.
  #
  # Concurrency: ci.yml's group is `ci-${{ github.workflow }}-${{ github.ref }}`,
  # and under `workflow_call` `github.workflow` resolves to the CALLING workflow,
  # so the nested run sits in `ci-Deploy (production)-<ref>`. A PR run
  # (`ci-CI-<ref>`) can therefore never cancel the nested gates out from under an
  # in-flight deploy, and this workflow's own `deploy-production` group queues
  # later runs rather than running them concurrently (code review 2026-09-03).
  quality-gates:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  # --- Gate 2: the full type-check (AC-1) ------------------------------------
  # NEW in 5-4. The old "tsc is deliberately not a gate" rationale died with the
  # strict-TS sweep (closed 2026-08-24; every package reports 0 errors).
  #
  # ⚠️ Uses `pnpm --filter <pkg> type-check`, NEVER the root `tsc:web` /
  # `tsc:core` / `tsc:db` / `tsc:config` scripts. Those are dead: they exit 1
  # with ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT *without running a compiler*, so a
  # grep for "error TS" over their output returns a confident, meaningless 0.
  type-check:
    name: Type-check (tsc, all packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from `packageManager` in package.json (pnpm@10.34.3).
        # Do NOT also pass `version:` — action-setup errors on a conflict.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- Prerequisites. Do NOT reorder or drop these. ---------------------
      # `tsc` reads the workspace packages through PROJECT REFERENCES, i.e. their
      # built `packages/*/dist/*.d.ts`, and `apps/web/src/router.tsx` imports the
      # generated `./routeTree.gen.ts`. Both are gitignored build artifacts, so a
      # fresh CI checkout has NEITHER — while a dev box has both lying around from
      # the last `pnpm dev`. That is why this job passed locally and failed here
      # with ~190 errors: 150-odd TS6305 "output file has not been built from
      # source file", 38 route errors cascading from the missing route tree, and a
      # tail of implicit-`any`s that were only downstream noise. None of them said
      # anything about the code under review.
      #
      # `tsc -b` (build mode), NOT `pnpm -r build`. What tsc actually consumes is
      # the `references` graph in the tsconfigs, and build mode walks that graph
      # itself — so the order is correct by construction and cannot drift out of
      # sync with pnpm's separate package-dependency graph. (Those two graphs HAD
      # drifted: `packages/core` imported types from `@budget-planner/db` without
      # declaring it, so pnpm saw no edge, built core and db CONCURRENTLY, and
      # core lost the race with the same TS6305. The dependency is declared now,
      # but the reason to prefer build mode here does not depend on that.)
      - name: Build workspace packages (project references)
        run: pnpm build:packages

      # Vite aliases `@budget-planner/*` to `src`, so this does not depend on the
      # step above; it is here for the SIDE EFFECT of the TanStack Start plugin
      # regenerating `src/routeTree.gen.ts`. There is no standalone generator CLI
      # (`@tanstack/router-generator` ships no bin), so a real build is the only
      # supported way to produce it. It also means a broken web build reds this
      # job rather than waiting for the Docker build.
      - name: Build the web app (generates src/routeTree.gen.ts)
        run: pnpm --filter web build

      # One step per package so a failure names the package in the job log.
      # `config` is included beyond AC-1's web/core/db list because it is a real
      # workspace package that already type-checks clean; leaving it unchecked on
      # the deploy path would be an arbitrary hole.
      - name: Type-check web
        run: pnpm --filter web type-check

      - name: Type-check core
        run: pnpm --filter @budget-planner/core type-check

      - name: Type-check db
        run: pnpm --filter @budget-planner/db type-check

      - name: Type-check config
        run: pnpm --filter @budget-planner/config type-check

  # --- Build + package the Start app for Rapids (AC-2) -----------------------
  # Runs on EVERY push, gated or not: building the image needs no DanubeData
  # account, and a Dockerfile that stopped building is something we want to learn
  # about now rather than on cutover day. Only the registry PUSH is blocked.
  #
  # No `needs:` — this runs IN PARALLEL with the quality gates and the
  # type-check (2026-09-15; it used to wait ~9 minutes for them). That is safe
  # because this job only builds and verifies locally and touches nothing
  # outside its runner: it references no secrets and never pushes. The step that
  # makes the image a deploy candidate — the registry push — lives in
  # `push-image`, which DOES need every gate. The verified bytes are handed over
  # as a short-lived artifact, so what gets pushed is exactly what booted here.
  build-image:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NOT for secrets (this job reads none; validate-deploy-workflow pins that).
    # VITE_COUNTERDEV_ID is defined at BOTH repository and `production` scope with
    # DIFFERENT values, and the environment value wins — so dropping this key
    # would silently bake the repository-scope id into the production bundle.
    # VITE_FORMSPARK_FORM_ID rides the same path; define it at ONE scope only, so
    # which value ships is not a question anyone has to look up.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build-time public vars (AC-2). These are baked into the client bundle by
      # `vite build` inside the image, so they MUST be build args, not runtime
      # env — setting VITE_COUNTERDEV_ID on the running container does nothing.
      # It is a public site identifier, not a secret (see apps/web/.env.example
      # and ADR-005), but it is passed from repo *variables* so it is configured
      # in one place. `__APP_VERSION__` needs no wiring: vite.config.ts inlines it
      # from package.json at build time.
      #
      # Build context is the monorepo root — the Dockerfile installs the whole
      # pnpm workspace (apps/web/Dockerfile documents this).
      - name: Build production image
        env:
          VITE_COUNTERDEV_ID: ${{ vars.VITE_COUNTERDEV_ID }}
          VITE_FORMSPARK_FORM_ID: ${{ vars.VITE_FORMSPARK_FORM_ID }}
        run: |
          set -euo pipefail
          docker build \
            -f apps/web/Dockerfile \
            --build-arg "VITE_COUNTERDEV_ID=${VITE_COUNTERDEV_ID}" \
            --build-arg "VITE_FORMSPARK_FORM_ID=${VITE_FORMSPARK_FORM_ID}" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      # Prove the image actually boots and serves before it is a deploy
      # candidate. This is the same three-way check 5-2 documented, run against
      # the container rather than a local build. No database is required:
      # /api/health is a process-up probe and the db client connects lazily.
      - name: Verify the image boots and serves
        run: |
          set -euo pipefail
          docker run -d --name bp-verify -p 8080:8080 \
            -e NODE_ENV=production \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e SITE_URL="https://example.invalid" \
            "${IMAGE_NAME}:${GITHUB_SHA}"

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "container is serving after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Image never became healthy within 30s"
              docker logs bp-verify
              exit 1
            fi
            sleep 1
          done

          curl -fsS -o /dev/null -w 'health: %{http_code}\n' http://127.0.0.1:8080/api/health
          curl -fsS -o /dev/null -w 'SSR /:   %{http_code}\n' http://127.0.0.1:8080/

      - name: Container logs (always)
        if: ${{ !cancelled() }}
        run: docker logs bp-verify || true

      - name: Stop verification container
        if: ${{ !cancelled() }}
        run: docker rm -f bp-verify || true

      # Hand the verified image to `push-image`. Only when deploys are on —
      # otherwise nothing would ever consume it. zstd, and no second zip pass on
      # an already-compressed file. One-day retention covers "Re-run failed jobs".
      - name: Export the verified image
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" | zstd -T0 -3 -q -o image.tar.zst
          ls -lh image.tar.zst

      - name: Upload the verified image
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: image.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # --- Push the verified image (AC-2) ----------------------------------------
  # The first job that makes a build a deploy candidate, so it needs EVERY gate:
  # lint/unit/e2e, the type-check, and the image build + boot check.
  push-image:
    name: Push container image
    runs-on: ubuntu-latest
    needs: [quality-gates, type-check, build-image]
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    timeout-minutes: 15
    # DANUBEDATA_REGISTRY_USERNAME/_PASSWORD are `production` ENVIRONMENT secrets
    # (DEPLOY_RUNBOOK.md §1). GitHub does NOT expose environment-scoped secrets to
    # a job that does not declare the environment — without this key they resolve
    # to EMPTY STRINGS and `docker login` silently runs with blank credentials.
    # Found in code review 2026-09-03; the workflow and the runbook had disagreed.
    environment: production
    steps:
      # Needed for `packageManager` in package.json, which pnpm/action-setup reads.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the verified image
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load the verified image
        run: |
          set -euo pipefail
          zstd -dc image.tar.zst | docker load
          docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}" > /dev/null

      # pnpm/Node for the CLI install below. Same reason as the deploy job: a
      # fresh runner inherits no toolchain. Enforced by validate-deploy-workflow.
      #
      # ⚠️ These run BEFORE the push now, not after, because the prune step below
      # runs before the push and needs the CLI. See that step's comment.
      - name: Set up pnpm
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install DanubeData CLI
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: pnpm add -g "@danubedata/cli@${{ env.DANUBE_CLI_VERSION }}"

      # Every run pushes a new SHA-tagged image and nothing removed the old ones.
      # Six runs filled a 500 MB plan and the seventh died with
      # `denied: Storage quota exceeded (638 MB used of 500 MB)` — after a full
      # build (run 34497637074, 2026-09-10).
      #
      # ⚠️ This step runs BEFORE the push, on purpose. A prune AFTER the push
      # cannot recover a registry that is already at quota: the push fails, the
      # job stops, and the prune never runs — the pipeline stays wedged until
      # someone deletes tags by hand. Pruning first means a full registry
      # self-heals on the next run.
      #
      # ⚠️ Retention is NOT just housekeeping: rollback redeploys an earlier tag
      # (DEPLOY_RUNBOOK §6), so pruning too hard deletes the thing you would roll
      # back TO. REGISTRY_KEEP_TAGS defaults to 2 — two rollback targets. It was
      # 5 until run 34528527480 (2026-09-10) died with `denied: Storage quota
      # exceeded (638 MB used of 500 MB)`: this is a fat image (the runtime stage
      # ships the whole workspace, apps/web/Dockerfile), and five of them do not
      # fit the 500 MB registry plan, so keep-5 could never self-heal. The
      # tag this run is about to push does not exist in the registry yet, so it
      # is structurally impossible for this step to delete it; the GITHUB_SHA
      # guard below is a belt-and-braces check for a re-run that re-pushes an
      # existing SHA.
      #
      # A prune failure WARNS rather than failing the job. If there was genuinely
      # room, the push below still succeeds. If there was not, the push fails
      # loudly with the quota error — the same signal as before, just one step
      # later, and now preceded by a real attempt to make room.
      - name: Prune old image tags
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        continue-on-error: true
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
          REGISTRY: ${{ vars.DANUBEDATA_REGISTRY }}
          KEEP_TAGS: ${{ vars.REGISTRY_KEEP_TAGS }}
        run: |
          set -euo pipefail
          # REGISTRY is host + namespace; the repository path drops the host.
          REPO="${REGISTRY#*/}/${IMAGE_NAME}"

          # ⚠️ REGISTRY_KEEP_TAGS is operator-set and its degenerate values are
          # dangerous: `0` would delete EVERY rollback target, and a non-integer
          # (`five`, a stray space) would crash `int()` below — which, under
          # `continue-on-error: true`, fails the step silently and prunes NOTHING
          # forever (the exact "silently never prunes" mode this step already
          # regressed into once). Validate loudly and clamp to >= 1. (Review
          # 2026-09-10.)
          KEEP="${KEEP_TAGS:-2}"
          case "${KEEP}" in
            ''|*[!0-9]*)
              echo "::error::REGISTRY_KEEP_TAGS must be a non-negative integer, got '${KEEP}'."
              exit 1
              ;;
          esac
          if [ "${KEEP}" -lt 1 ]; then
            echo "::warning::REGISTRY_KEEP_TAGS=${KEEP} would leave no rollback target; clamping to 1."
            KEEP=1
          fi
          echo "Keeping the ${KEEP} newest tags in ${REPO}"

          # ⚠️⚠️ NEVER PRUNE A TAG THAT IS CURRENTLY DEPLOYED. Added 2026-09-16
          # after this step took the live site down.
          #
          # A deployed Knative revision is pinned to the exact image it was created
          # from. On 2026-09-15 several deploy attempts pushed tags in quick
          # succession, pushing the tag `budget-planner-web` was RUNNING out of the
          # keep-window; this step deleted it. The container served happily until it
          # scaled to zero, then could not restart — `manifest unknown` — and the
          # site was down from ~05:28 CEST until it was redeployed by hand.
          #
          # "Keep one more tag" was considered and rejected: it moves the cliff
          # instead of removing it, and a burst of runs walks straight off the new
          # one. Age is the wrong question; "is anything running this?" is the right
          # one.
          #
          # FAILS CLOSED: if the deployed tags cannot be read, this prunes NOTHING.
          # A registry that grows is a bounded, visible problem; deleting the image
          # your site is running is an outage.
          if ! deployed=$(danube --json rapids ls | python3 .github/scripts/rapids_deployed_tags.py); then
            echo "::warning::Could not determine which tags are deployed; skipping the prune entirely."
            echo "A tag pruned while a container runs it takes the site down on its next cold start."
            exit 0
          fi
          printf 'Deployed tags (never pruned): %s\n' "${deployed:-none}"
          printf '%s\n' "${deployed}" > /tmp/deployed-tags.txt

          danube --json registry repos tags "${REPO}" > /tmp/tags.json

          # Newest-first by pushed_at, skip the newest KEEP, and never the tag
          # this run just pushed even if the sort or the clock disagrees, and never
          # a tag some container is currently deployed from.
          doomed=$(KEEP="${KEEP}" KEEPSHA="${GITHUB_SHA}" python3 - <<'PY'
          import json, os, sys

          # ⚠️⚠️ The CLI's `--json` mode DOUBLE-WRAPS the response. `jsonOutput(res)`
          # (dist/lib/json-mode.js) puts whatever it is given under ANOTHER "data"
          # key, and `res` here is the server's OWN `{ data: [...tags] }` payload
          # (confirmed against dist/commands/registry/repositories.js, where human
          # mode reads `res.data`). So the tag array is at .data.data, not .data:
          #
          #   {"success":true,"data":{"data":[{tag,digest,bytes_size,pushed_at},...]}}
          #
          # First shipped reading .data directly, which is the INNER dict, not the
          # list -- crashed a real run with `AttributeError: 'dict' object has no
          # attribute 'sort'`. `continue-on-error: true` kept that deploy green, so
          # NO tag was ever actually pruned and the quota filled again days later.
          # A prune that silently never prunes is the same failure mode this
          # comment is now guarding against a second time. The fallback below
          # accepts EITHER the confirmed nested shape or a bare list directly
          # under "data" (in case a future CLI version flattens it) -- anything
          # else raises with the actual payload attached, rather than quietly
          # reporting "0 pruned", which looks identical to "already caught up".
          keep = int(os.environ["KEEP"])
          keepsha = os.environ["KEEPSHA"]
          envelope = json.load(open("/tmp/tags.json"))
          inner = envelope.get("data")
          rows = inner.get("data") if isinstance(inner, dict) else inner
          if not isinstance(rows, list):
              sys.exit(
                  "registry repos tags returned an unexpected shape (expected "
                  f"data.data to be a list, got {type(rows).__name__}): "
                  f"{json.dumps(envelope)[:500]}"
              )
          # If the listing is paginated we only ever see the first page, so the
          # oldest tags (the ones most worth pruning) may not be in `rows` at
          # all and the quota keeps climbing. The CLI 1.1.0 response has no
          # pagination envelope; warn if a future version adds a cursor or the
          # page looks capped, rather than silently under-pruning.
          page_meta = inner if isinstance(inner, dict) else {}
          if any(k in page_meta for k in ("next", "next_cursor", "cursor", "page", "total")):
              print(
                  "::warning::registry tag listing looks paginated; prune may only "
                  "cover the first page — verify the CLI response shape",
                  file=sys.stderr,
              )
          # Tags currently deployed to a Rapids container. Read from a file the
          # step wrote after a fail-closed check: if that check could not answer,
          # the step already exited without pruning anything, so reaching here
          # means this list is trustworthy.
          try:
              with open("/tmp/deployed-tags.txt", encoding="utf-8") as fh:
                  deployed = {line.strip() for line in fh if line.strip()}
          except OSError:
              sys.exit("deployed-tag list missing; refusing to prune")

          rows.sort(key=lambda r: r.get("pushed_at") or "", reverse=True)
          for r in rows[keep:]:
              tag = r.get("tag")
              if not tag or tag == keepsha:
                  continue
              if tag in deployed:
                  # Deleting this is what caused the 2026-09-16 outage.
                  print(f"::notice::keeping {tag} — a container is deployed from it", file=sys.stderr)
                  continue
              print(tag)
          PY
          )

          if [ -z "${doomed}" ]; then
            echo "Nothing to prune."
            exit 0
          fi

          # `done <<< "${doomed}"`, NOT `echo … | while read`: a pipe puts the
          # loop in a subshell AND leaves the tag list on stdin, so if `danube
          # rm-tag` ever reads stdin it consumes the rest and only the first tag
          # is deleted (the classic ssh-in-a-loop bug). A here-string keeps the
          # loop in this shell and gives the child a clean stdin.
          while read -r tag; do
            [ -n "${tag}" ] || continue
            echo "Deleting ${REPO}:${tag}"
            danube registry repos rm-tag "${REPO}" "${tag}" --force < /dev/null
          done <<< "${doomed}"

          danube registry usage || true

      # [OPS] blocked-on-account: push the built image to the DanubeData
      # registry. Fails loudly if deploys are enabled without a registry
      # configured, rather than letting a later job deploy a stale image.
      #
      # Runs AFTER the prune above, so a registry that filled up recovers on its
      # own before this step is attempted.
      - name: Push image to the DanubeData registry
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        env:
          REGISTRY: ${{ vars.DANUBEDATA_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.DANUBEDATA_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DANUBEDATA_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY:-}" ]; then
            echo "::error::DEPLOY_ENABLED is true but the DANUBEDATA_REGISTRY variable is unset."
            echo "Set it to the registry path from provisioning (Story 4-16/5-2) before enabling deploys."
            exit 1
          fi
          # Reject malformed values up front. A trailing slash or a scheme would
          # otherwise build a broken image reference (`host//name`, `https://...`)
          # and fail later with an opaque Docker error instead of this message.
          case "${REGISTRY}" in
            */)      echo "::error::DANUBEDATA_REGISTRY must not end with '/': '${REGISTRY}'"; exit 1 ;;
            *://*)   echo "::error::DANUBEDATA_REGISTRY must not include a scheme: '${REGISTRY}'"; exit 1 ;;
            *\ *)    echo "::error::DANUBEDATA_REGISTRY must not contain spaces: '${REGISTRY}'"; exit 1 ;;
          esac
          # DANUBEDATA_REGISTRY is the full image PREFIX (host + namespace), e.g.
          # cr.danubedata.ro/budgetplanner795. `docker login` takes the HOST ONLY —
          # passing it a path fails — so strip everything from the first slash.
          REGISTRY_HOST="${REGISTRY%%/*}"
          echo "Logging in to ${REGISTRY_HOST}"
          echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY_HOST}" -u "${REGISTRY_USERNAME}" --password-stdin
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

  # --- Are there migrations to apply? ----------------------------------------
  # The migrate job costs a few minutes and most pushes change no migration, so
  # this decides whether it has to run at all. (Before Story 5.18 it also kept
  # the database's public DNS window closed on pushes that did not need it;
  # there is no window any more, so this is now purely a time saving.)
  #
  # The baseline is the head commit of the most recent run whose DEPLOY JOB
  # succeeded — not `github.event.before`. A deploy only succeeds after its
  # migrations were applied (or were found to be already applied by this same
  # check), so that commit's migrations are known to be live. `event.before`
  # would be wrong twice over: a previous run that failed before migrating would
  # be forgotten, and this workflow's concurrency group REPLACES a pending run
  # with a newer one, so a push's migrations can belong to a run that never ran.
  #
  # FAILS SAFE: every path that cannot prove "nothing changed" — a manual
  # dispatch, an API error, no previous deploy, a baseline commit missing from
  # history (force-push), a git error — outputs migrate=true. If this job itself
  # fails, its output is empty, which the deploy job treats as "not proven", so
  # nothing deploys.
  migration-check:
    name: Detect pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `actions: read` to list previous runs of this workflow and their jobs. The
    # only job allowed to widen permissions; validate-deploy-workflow pins it.
    permissions:
      contents: read
      actions: read
    outputs:
      migrate: ${{ steps.detect.outputs.migrate }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout (full history, to diff against the last deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare migrations against the last successful deploy
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
          # Must match the deploy job's `name:` exactly (pinned by the validator).
          DEPLOY_JOB_NAME: Deploy to DanubeData Rapids
          # What `drizzle-kit migrate` actually applies: the journal + SQL files,
          # and the config that names that folder and the migrations table.
          MIGRATION_PATHS: packages/db/migrations packages/db/drizzle.config.ts
        run: |
          set -uo pipefail
          decide() {
            echo "migrate=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
            echo "::notice::migrate=$1 — $2"
            exit 0
          }

          # A dispatch is the rollback / redeploy path; keep its old behaviour.
          [ "${EVENT_NAME}" = "push" ] || decide true "manual dispatch always migrates"

          runs=$(gh api "repos/${REPO}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=30" \
            --jq '.workflow_runs[] | "\(.id) \(.head_sha)"') \
            || decide true "could not list previous deploy runs"

          base=""
          while read -r id sha; do
            [ -n "${id}" ] || continue
            [ "${id}" != "${CURRENT_RUN}" ] || continue
            deployed=$(gh api "repos/${REPO}/actions/runs/${id}/jobs?per_page=100" \
              --jq "[.jobs[] | select(.name == \"${DEPLOY_JOB_NAME}\" and .conclusion == \"success\")] | length" < /dev/null) \
              || decide true "could not read the jobs of run ${id}"
            if [ "${deployed}" -gt 0 ]; then
              base="${sha}"
              break
            fi
          done <<< "${runs}"

          [ -n "${base}" ] || decide true "no previous successful deploy in the last 30 successful runs"
          git cat-file -e "${base}^{commit}" 2>/dev/null \
            || decide true "last deployed commit ${base} is not in this history"

          # ⚠️ `|| status=$?` is REQUIRED, not stylistic. GitHub runs every `run:`
          # block as `bash -e {0}` — the `-e` is injected by the runner and a
          # script cannot opt out by merely omitting it from its own `set` line.
          # `git diff --quiet` returns 1 to mean "there ARE changes", which is this
          # step's whole answer, but `-e` treats that 1 as a fatal error and kills
          # the script before `case` runs. Result: the job failed with exit 1 and
          # no output on the first push that actually touched a migration path
          # (run 35041921329, 2026-09-15). Capturing the status keeps it data.
          status=0
          # shellcheck disable=SC2086 # MIGRATION_PATHS is a deliberate word list
          git diff --quiet "${base}" "${GITHUB_SHA}" -- ${MIGRATION_PATHS} || status=$?
          case ${status} in
            0) decide false "no migration changes since the last deployed commit ${base}" ;;
            1) decide true "migrations changed since the last deployed commit ${base}" ;;
            *) decide true "git diff against ${base} failed" ;;
          esac

  # --- Database migration (AC-4) — closes 5-8 AC-11 -------------------------
  # Ordered BEFORE the deploy so the schema is never behind the code that serves
  # it, and any failure here aborts the run before the new revision goes live.
  #
  # Runs only when `migration-check` says there is something to apply. When it
  # is skipped for that reason, `deploy` proceeds; when it is skipped or fails
  # for any other reason, `deploy` does not (see the deploy job's `if:`).
  #
  # `build-image` and `push-image` also name the `production` Environment and run
  # first, so an Environment approval rule pauses the run THERE before here. Four
  # jobs name it in total — build-image, push-image, migrate, deploy — and GitHub
  # prompts once per job. DEPLOY_RUNBOOK.md §3 has the authoritative account.
  #
  # ✅ IN-CLUSTER SINCE STORY 5.18 (2026-09-15). The ADR-001 time-boxed exception
  # — open the database's public DNS, migrate from this runner, close it again —
  # is RETIRED. It expired on its own terms the moment the database held real
  # user data, which live 5.3 checkouts produced.
  #
  # How this works now: the database is reachable only over Kubernetes in-cluster
  # DNS, and DanubeData Rapids offers no run-to-completion job primitive and no
  # container command override (re-verified against @danubedata/cli 1.1.0 on
  # 2026-09-15). So the app image is started as a short-lived Rapids container in
  # the same cluster and namespace, in `APP_ENTRYPOINT=migrate` mode. It applies
  # the migrations, reports a terminal verdict over a token-gated endpoint, and is
  # deleted. No public database endpoint is opened at any point.
  #
  # ⚠️ Readiness is NOT the verdict. `/healthz` goes green as soon as the
  # container boots, deliberately: if readiness meant "the migration succeeded",
  # then a failed migration, a broken image and a crash-loop would all present as
  # the same `--wait` timeout. The verdict is read positively from
  # `/migrate-status`, and anything short of an explicit `succeeded` fails the job.
  migrate:
    name: Migrate production database
    runs-on: ubuntu-latest
    needs: [push-image, migration-check]
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && needs.migration-check.outputs.migrate == 'true' }}
    environment: production
    # Tight on purpose. Because this workflow serialises on a NON-cancelling
    # concurrency group, one stuck run queues every later deploy behind it.
    # Budget: ~2min setup + container create/update + cold start + the apply
    # itself, with the verdict poll separately bounded at 600s below.
    timeout-minutes: 20
    env:
      # The short-lived migrate container. A FIXED name (not run-scoped) so a
      # leftover from a crashed run is reused and torn down rather than
      # accumulating one orphan per failure — each of which would hold a
      # DATABASE_URL in its environment.
      MIGRATE_CONTAINER: budget-planner-migrator
      # In-cluster writer endpoint. Static now that no public endpoint is ever
      # opened, so there is nothing to discover at run time.
      # ⚠️ Must stay in sync with EU_DB_INTERNAL_HOSTS in packages/db/src/client.ts:
      # `buildMigrationCredentials` refuses any host that is not on that list, so a
      # drift here fails the migration closed rather than connecting to something
      # unexpected.
      DB_INTERNAL_HOST: budget-planner-prod-rw.budgetplanner795.svc.cluster.local
      DB_INTERNAL_PORT: '5432'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned: this job's safety now rests on `rapids apply/update/rm` behaving
      # exactly as expected, so the tool does not float underneath the pipeline.
      - name: Install the DanubeData CLI
        run: pnpm add -g "@danubedata/cli@${{ env.DANUBE_CLI_VERSION }}"

      # DANUBE_TOKEN is read from the environment by `danube` itself — the CLI's
      # own help recommends this over `--token` to keep it out of shell history.
      - name: Authenticate the DanubeData CLI
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
        run: danube whoami

      # Offline, and before anything is created: an expired or missing CA makes
      # the migration impossible, so failing here costs nothing.
      #
      # ⚠️ Threshold is deliberately 0, NOT the 21 days the weekly job uses. This
      # gate blocks only on a certificate that is actually broken — expired or
      # unparseable. A deploy is not the place to refuse work over a certificate
      # that still has three weeks left; that is what the scheduled warning is
      # for. Two different questions, two different thresholds.
      - name: Verify the database CA certificate is usable
        env:
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          CA_EXPIRY_WARN_DAYS: '0'
        run: pnpm --filter @budget-planner/db db:ca-expiry

      # Per-run secret for the status endpoint. The migrate container is publicly
      # routable for the minutes it exists, and its status endpoint would
      # otherwise describe the production database's migration state to anyone.
      # Minted here, never stored, dies with the container.
      - name: Mint the migration status token
        id: token
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      # Composed from the INTERNAL host only. There is no endpoint discovery any
      # more: nothing is exposed, so nothing has to be looked up, and the port is
      # the stable in-cluster 5432 rather than the public port that DanubeData
      # reassigned on every `dns enable` (5445 -> 5446 -> refused, across 2026-09).
      #
      # DATABASE_MIGRATOR_USER and DATABASE_NAME are repository variables, not
      # secrets — `bp_migrator` / `pgdb` are already plaintext in
      # docs/production-database-runbook.md. Only the password is sensitive.
      - name: Compose the in-cluster DATABASE_URL
        id: dburl
        env:
          DB_USER: ${{ vars.DATABASE_MIGRATOR_USER }}
          DB_PASSWORD: ${{ secrets.DATABASE_MIGRATOR_PASSWORD }}
          DB_NAME: ${{ vars.DATABASE_NAME }}
        run: |
          set -euo pipefail
          for var in DB_USER DB_PASSWORD DB_NAME; do
            if [ -z "${!var:-}" ]; then
              echo "::error::${var} is not set. See DEPLOY_RUNBOOK.md §1 for the required repo variable/secret."
              exit 1
            fi
          done

          database_url=$(python3 -c "
          import os
          from urllib.parse import quote
          user = quote(os.environ['DB_USER'], safe='')
          password = quote(os.environ['DB_PASSWORD'], safe='')
          host = os.environ['DB_INTERNAL_HOST']
          port = os.environ['DB_INTERNAL_PORT']
          print(f\"postgresql://{user}:{password}@{host}:{port}/{os.environ['DB_NAME']}\")
          ")
          echo "::add-mask::${database_url}"
          echo "url=${database_url}" >> "$GITHUB_OUTPUT"
          echo "::notice::Migrating over internal DNS (${DB_INTERNAL_HOST}:${DB_INTERNAL_PORT}). No public endpoint is opened."

      # ⚠️ ONE CALL. This was two — `apply` to create, then `update` to inject the
      # environment — because `apply` could not set env before CLI 1.3.0. That gap
      # is closed, and closing it removes a real hazard rather than just tidying:
      #
      # DanubeData confirmed (2026-09-16) that an update arriving while the
      # PREVIOUS update to the same container was still rolling out was accepted,
      # returned success, and was then never rolled out. Our two calls landed
      # seconds apart, every run, which is precisely that collision. At 13:32 and
      # 13:53 UTC the second call of each pair — the one setting `--min-scale 1` —
      # was silently dropped, so the migration never started and the job polled a
      # container that was never told to run. The platform-side fix is in flight;
      # this removes our side of it regardless.
      #
      # `--wait` is generation-aware in 1.3.0: it follows the `spec_generation` this
      # very call produced and returns only once `observed_generation` has caught up
      # and `status_details.operation.terminal` is true. So a green step here means
      # THIS configuration is live — not merely accepted.
      - name: Start the migration (create-or-update in one call)
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ vars.DANUBEDATA_REGISTRY }}
          RESOURCE_PROFILE: ${{ vars.RAPIDS_RESOURCE_PROFILE || 'small' }}
          IDEMPOTENCY_KEY: migrate-${{ github.run_id }}-${{ github.run_attempt }}
          DATABASE_URL: ${{ steps.dburl.outputs.url }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          STATUS_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # ⚠️ NEVER add `--json` to this step. The container object it prints
          # carries `environment_variables` WITH VALUES — it would put DATABASE_URL
          # and its password straight into the run log. (True of `rapids ls --json`
          # too, which is why every step reading that pipes into a script emitting
          # only a single word or a URL.) The validator pins this.
          danube rapids apply \
            --name "${MIGRATE_CONTAINER}" \
            --image "${REGISTRY}/${IMAGE_NAME}" \
            --tag "${IMAGE_TAG}" \
            --port 8080 \
            --health-check-path /healthz \
            --profile "${RESOURCE_PROFILE}" \
            --min-scale 1 \
            --max-scale 1 \
            --env \
              "APP_ENTRYPOINT=migrate" \
              "NODE_ENV=production" \
              "DATABASE_URL=${DATABASE_URL}" \
              "DATABASE_CA_CERT=${DATABASE_CA_CERT}" \
              "MIGRATE_STATUS_TOKEN=${STATUS_TOKEN}" \
              "MIGRATE_RUN_ID=${RUN_ID}" \
            --idempotency-key "${IDEMPOTENCY_KEY}" \
            --wait \
            --wait-timeout 10m
          echo "::notice::Migrate container is live with this run's configuration. Polling for a verdict."

      # Read the container's public URL out of the API. `--json` is piped straight
      # into python and ONLY the url field is ever printed — necessary because the
      # raw rows carry environment_variables with their values.
      - name: Resolve the migrate container URL
        id: url
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
        run: |
          # ⚠️ `set -e` is deliberately NOT used here. With it, a single transient
          # CLI/API failure aborted this step on the first iteration and the retry
          # loop only ever protected against an EMPTY url — i.e. it guarded the one
          # failure that was least likely. Each attempt now absorbs its own failure
          # and the loop is what decides.
          set -uo pipefail
          url=""
          for i in $(seq 1 12); do
            listing=$(danube --json rapids ls 2>/dev/null) || listing=""
            if [ -n "${listing}" ]; then
              url=$(printf '%s' "${listing}" | python3 -c "
          import json, os, sys
          try:
              rows = json.load(sys.stdin).get('data') or []
          except Exception:
              rows = []
          row = next((r for r in rows if isinstance(r, dict) and r.get('name') == os.environ['MIGRATE_CONTAINER']), None)
          print((row or {}).get('url') or '')
          " 2>/dev/null) || url=""
            fi
            if [ -n "${url}" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "${url}" ]; then
            echo "::error::${MIGRATE_CONTAINER} never reported a URL within 60s."
            exit 1
          fi
          echo "::notice::Migrate container URL: ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # THE VERDICT. Exit status propagates straight out of this step into the
      # job, and every downstream job `needs:` this one, so a failed or
      # unreadable migration aborts the release before `deploy` runs (AC-3).
      #
      # Fails closed on every ambiguous outcome: still `running` at the deadline,
      # unreachable, unparseable, a run id that is not ours, or any state that is
      # not exactly `succeeded`.
      - name: Wait for the migration verdict
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
          STATUS_TOKEN: ${{ steps.token.outputs.token }}
          CONTAINER_URL: ${{ steps.url.outputs.url }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          deadline=$(( SECONDS + 600 ))
          state="(never reached)"
          body=""
          last_error="(no attempt completed)"

          while [ "${SECONDS}" -lt "${deadline}" ]; do
            # ⚠️ `-L` is REQUIRED. `danube rapids ls` reports the container URL with
            # an `http://` scheme and the platform edge 301-redirects to https.
            # Without -L, curl returns exit 0 and an EMPTY BODY for that redirect —
            # so the poll read "unparseable" forever and the job hung until its
            # 600s deadline while the migration had in fact already succeeded
            # (live run 35042874267-1, 2026-09-16). The `-n "${body}"` guard is the
            # second half of that lesson: a successful curl with nothing in it is
            # not a verdict.
            if body=$(curl -fsSL --max-time 15 \
                -H "Authorization: Bearer ${STATUS_TOKEN}" \
                "${CONTAINER_URL%/}/migrate-status" 2>/tmp/curl-err) && [ -n "${body}" ]; then
              parsed=$(printf '%s' "${body}" | python3 -c "
          import json, sys
          try:
              payload = json.load(sys.stdin)
              print(payload.get('state', 'unparseable'), payload.get('runId', ''))
          except Exception:
              print('unparseable', '')
          ") || parsed="unparseable "
              state="${parsed%% *}"
              reported_run="${parsed#* }"

              # A verdict from a container this run did not start is not our
              # verdict, whatever it says. Keep polling rather than trusting it.
              if [ "${reported_run}" != "${RUN_ID}" ]; then
                last_error="reported runId '${reported_run}' != this run '${RUN_ID}'"
                state="(foreign container)"
              elif [ "${state}" != "running" ]; then
                break
              fi
            else
              # Distinguish "curl failed" from "curl succeeded but said nothing" —
              # the second is what an unfollowed redirect looks like, and reporting
              # them identically is what made the earlier hang so hard to read.
              curl_err="$(tr -d '\n' < /tmp/curl-err 2>/dev/null)" || curl_err=""
              if [ -n "${curl_err}" ]; then
                last_error="curl: ${curl_err}"
              else
                last_error="empty response from ${CONTAINER_URL%/}/migrate-status (redirect not followed, or no body)"
              fi
            fi

            # SECOND CHANNEL — the logs. The endpoint above is reached through the
            # container's public URL, and Knative routes that URL to whatever
            # revision is currently READY, which need not be the one that migrated.
            # Live run 35042874267-1: the migration SUCCEEDED and every later poll
            # got 401 from a successor revision holding a different token, so the
            # job timed out on work that was already done. Logs aggregate across
            # revisions, so they can answer when the URL cannot.
            #
            # Matched on this run's id, so a previous release's verdict sitting in
            # the log window is never mistaken for this one.
            log_verdict=$(danube --json rapids logs "${MIGRATE_CONTAINER}" --since 1h --limit 500 2>/dev/null \
              | python3 .github/scripts/rapids_verdict.py "${RUN_ID}") || log_verdict="error"
            case "${log_verdict}" in
              succeeded)
                echo "::notice::Verdict read from the container logs for run ${RUN_ID}."
                state="succeeded"
                break
                ;;
              failed:*)
                echo "::error::Logs report this run's migration failed (${log_verdict#failed:})."
                state="failed"
                break
                ;;
              error)
                # Not fatal on its own: the HTTP channel may still answer, and a
                # missing `serverless:diagnostics` scope shows up exactly here.
                last_error="${last_error}; logs unreadable"
                ;;
            esac

            sleep 10
          done

          echo "::notice::Terminal state: ${state}"

          if [ "${state}" = "succeeded" ]; then
            echo "Migration applied in-cluster. No public endpoint was opened."
            exit 0
          fi

          # Diagnostics, not the verdict: logs can be reported unavailable, which
          # is exactly why the verdict does not travel through them.
          echo "::error::Migration did not succeed (state: ${state}). Aborting the release before deploy."
          echo "Last transport error: ${last_error}"
          echo "--- status body ---"
          printf '%s\n' "${body:-(no response)}"
          echo "--- revisions ---"
          danube rapids revisions "${MIGRATE_CONTAINER}" || true
          echo "--- events ---"
          danube rapids events "${MIGRATE_CONTAINER}" || true
          echo "--- logs ---"
          danube rapids logs "${MIGRATE_CONTAINER}" --since 30m --limit 200 || true
          exit 1

      # `always()` is load-bearing, exactly as the window-close step it descends
      # from was: this MUST run when the migration fails, when the verdict times
      # out, when a step errors, and when the job is cancelled.
      #
      # ⚠️ This step REPLACES a `rapids rm`. The container is no longer deleted —
      # deleting it is what left orphaned config in DanubeData's GitOps repo and
      # broke the next two provisions. Instead it is scaled back to zero (so no pod
      # runs and it costs ~nothing) and its credentials are STRIPPED, which is the
      # property deletion was really there for.
      #
      # The strip is then VERIFIED, because "the container holds no credentials
      # between releases" is a safety claim and an unverified safety claim is just
      # a hope. The check reads a WORD (`clean`/`dirty:KEYS`/`error`) rather than an
      # exit code, for the same reason the presence check does: an exit code cannot
      # distinguish "they are gone" from "we could not tell", and an earlier version
      # of this job announced success on exactly that confusion.
      - name: Scale down and strip the migrate container's credentials
        if: ${{ always() }}
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
        run: |
          set -uo pipefail
          SECRET_KEYS="DATABASE_URL DATABASE_CA_CERT MIGRATE_STATUS_TOKEN MIGRATE_RUN_ID"

          # `always()` means this can run before the container ever existed, where
          # `update` returns non-zero. The exit code is advisory; the STATE CHECK
          # below decides.
          # shellcheck disable=SC2086 # SECRET_KEYS is a deliberate word list
          # `--wait` (CLI 1.3.0) follows THIS call's `spec_generation` and returns
          # only once it is actually live, so the strip cannot be one of the
          # accepted-but-never-rolled-out updates that cost us two runs. The state
          # check below still decides — `--wait` makes it converge, it does not
          # replace it.
          danube rapids update "${MIGRATE_CONTAINER}" \
            --rm-env ${SECRET_KEYS} \
            --min-scale 0 \
            --wait \
            --wait-timeout 5m \
            || echo "rapids update returned non-zero; verifying actual state instead"

          verdict="error"
          for i in $(seq 1 12); do
            listing=$(danube --json rapids ls 2>/dev/null) || listing=""
            # shellcheck disable=SC2086 # SECRET_KEYS is a deliberate word list
            verdict=$(printf '%s' "${listing}" \
              | python3 .github/scripts/rapids_env_check.py "${MIGRATE_CONTAINER}" ${SECRET_KEYS}) \
              || verdict="error"
            if [ "${verdict}" = "clean" ]; then
              echo "::notice::Migrate container scaled to zero; credentials stripped."
              exit 0
            fi
            sleep 5
          done

          if [ "${verdict}" = "error" ]; then
            echo "::error::Could not establish whether ${MIGRATE_CONTAINER} still holds credentials — the listing was unreadable."
            echo "Treating this as STILL HOLDING them."
          else
            echo "::error::${MIGRATE_CONTAINER} still holds credentials after 60s (${verdict})."
          fi
          echo "Strip them by hand: danube rapids update ${MIGRATE_CONTAINER} --rm-env ${SECRET_KEYS} --min-scale 0"
          exit 1

  # --- Deploy to Rapids (AC-2/AC-5) ------------------------------------------
  deploy:
    name: Deploy to DanubeData Rapids
    runs-on: ubuntu-latest
    needs: [push-image, migration-check, migrate]
    # `!cancelled()` replaces the implicit success() so this can run when
    # `migrate` was SKIPPED — but only skipped because `migration-check`
    # positively reported nothing to apply. Every other state (migrate failed,
    # migrate skipped because the check failed and left its output empty, image
    # not pushed) keeps the deploy off. Do not loosen to `always()`.
    if: >-
      ${{ !cancelled()
      && vars.DEPLOY_ENABLED == 'true'
      && github.ref == 'refs/heads/main'
      && needs.push-image.result == 'success'
      && (needs.migrate.result == 'success'
      || (needs.migrate.result == 'skipped'
      && needs.migration-check.result == 'success'
      && needs.migration-check.outputs.migrate == 'false')) }}
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A manual dispatch may name an older SHA — that is the rollback path.
      - name: Resolve image tag
        id: resolve
        env:
          REQUESTED: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED:-$GITHUB_SHA}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: ${TAG}"

      # ⚠️ pnpm and Node are prerequisites of the CLI install below, not
      # decoration. This job originally jumped straight to `pnpm add -g` — copied
      # from the migrate job without the setup steps that precede it there — and
      # died with `pnpm: command not found` AFTER the migration had already been
      # applied to production. Every job is its own runner with its own empty
      # toolchain; nothing is inherited from an earlier job.
      #
      # No `pnpm install` here on purpose: this job runs no workspace script, so
      # the lockfile install would be ~90 seconds of nothing.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The CLI is pinned for the same reason the migrate job pins it: this
      # rollout's safety depends on `rapids apply --wait` meaning exactly what it
      # means today, so the tool does not float underneath the pipeline.
      - name: Install DanubeData CLI
        run: pnpm add -g "@danubedata/cli@${{ env.DANUBE_CLI_VERSION }}"

      # Fail on a bad/expired token HERE, before anything is mutated, rather than
      # halfway through a rollout. Mirrors the migrate job.
      - name: Verify CLI authentication
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
        run: |
          set -euo pipefail
          danube whoami

      # Catches a missing/misnamed/unreadable image before the rollout starts.
      # NOTE the calling convention differs from `apply` below: preflight takes
      # ONE full reference including the tag, while apply splits repository and
      # tag across --image/--tag. Verified against @danubedata/cli 1.1.0.
      - name: Preflight the image
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          REGISTRY: ${{ vars.DANUBEDATA_REGISTRY }}
        run: |
          set -euo pipefail
          danube rapids preflight --image "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

      # `apply` is create-or-update against the desired state, so the first
      # deploy and every later one take the same path — no "does it exist yet"
      # branch to get wrong, and re-running an unchanged SHA is a no-op rather
      # than a spurious revision.
      #
      # ⚠️ --wait is load-bearing, not cosmetic. Without it the step exits 0 as
      # soon as the API accepts the desired state, while the revision is still
      # rolling out, and the smoke job then measures the OLD revision — a green
      # deploy of nothing. --wait-timeout bounds it so a stuck rollout fails the
      # run instead of hanging until the job timeout.
      #
      # ⚠️ What this CANNOT set, because the CLI has no flag for it: environment
      # variables (only `rapids update --env` does), request timeout, concurrency
      # target, and CPU/memory (only via --profile, whose valid names are not
      # documented). Those are configured once at provisioning and are NOT
      # reasserted here — see apps/web/rapids-service.yaml and DEPLOY-RAPIDS.md §2.
      # This step therefore rolls out CODE, not full service configuration.
      - name: Deploy revision to Rapids
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          REGISTRY: ${{ vars.DANUBEDATA_REGISTRY }}
          # run_id alone is STABLE across "Re-run failed jobs" (only run_attempt
          # changes), so a re-run after a rollout that was accepted-then-failed
          # would replay the cached outcome instead of driving the revision to
          # completion. Include run_attempt. (Review 2026-09-10.)
          IDEMPOTENCY_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          # Valid values are free | small | medium | large (read from the CLI's
          # own interactive picker, @danubedata/cli 1.1.0 create.js). Creating a
          # container REQUIRES one: omitting it fails with
          # `422 resource_profile: Please select a resource profile`, which this
          # step hit on 2026-09-09.
          #
          # `small` (0.5-1 vCPU, 256-512MB) is Lucas' decision, and it matches
          # what apps/web/rapids-service.yaml has specified since story 5-2.
          # ⚠️ NOT `free`: 64-128MB is marginal for a TanStack Start SSR Node
          # process, and the free tier also caps max-scale at 3 while this step
          # asks for 5. Scale-to-zero means idle cost stays ~EUR 0 either way.
          RESOURCE_PROFILE: ${{ vars.RAPIDS_RESOURCE_PROFILE || 'small' }}
        run: |
          set -euo pipefail
          echo "Rolling out ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} to Rapids (Falkenstein, DE)"
          danube rapids apply \
            --name "${IMAGE_NAME}" \
            --image "${REGISTRY}/${IMAGE_NAME}" \
            --tag "${IMAGE_TAG}" \
            --port 8080 \
            --health-check-path /api/health \
            --profile "${RESOURCE_PROFILE}" \
            --min-scale 0 \
            --max-scale 5 \
            --idempotency-key "${IDEMPOTENCY_KEY}" \
            --wait \
            --wait-timeout 10m

  # --- Post-deploy smoke check (AC-5) ----------------------------------------
  # A deploy is not done because the deploy tool exited 0 — it is done when the
  # live URL actually serves. A failure here reds the run and is the signal to
  # roll back (DEPLOY_RUNBOOK.md); it does not auto-roll-back, because an
  # automatic rollback on an unproven pipeline is its own hazard.
  smoke:
    name: Post-deploy smoke check
    runs-on: ubuntu-latest
    needs: deploy
    # Explicit result check: `deploy` can succeed while an upstream job
    # (`migrate`) was skipped, and the implicit success() would then skip this.
    if: ${{ !cancelled() && vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success' }}
    timeout-minutes: 10
    steps:
      - name: Smoke-check the live site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ]; then
            echo "::error::SITE_URL repository variable is unset; cannot smoke-check the deploy."
            exit 1
          fi

          # Strip a trailing slash before composing paths. With `SITE_URL` set to
          # "https://host/", the requests below became "https://host//" and
          # "https://host//api/health" — and `//` is a protocol-relative target
          # the server returned 500 for (fixed in node-adapter.mjs the same day).
          # The server no longer breaks on it; this stops the smoke check
          # fabricating the shape in the first place, so a stray slash in a
          # GitHub variable cannot fail a good deploy.
          SITE_URL="${SITE_URL%/}"
          echo "Smoke-checking ${SITE_URL}"

          # 1. The SSR document renders.
          code=$(curl -fsS -o /tmp/home.html -w '%{http_code}' --max-time 30 "${SITE_URL}/")
          echo "GET /            -> ${code}"
          grep -qi '<html' /tmp/home.html \
            || { echo "::error::/ returned ${code} but the body is not an HTML document"; exit 1; }

          # 2. A server route executes (proves it is the SSR server, not a CDN
          #    serving a stale static shell).
          health=$(curl -fsS --max-time 30 "${SITE_URL}/api/health")
          echo "GET /api/health  -> ${health}"
          echo "${health}" | grep -q '"status"' \
            || { echo "::error::/api/health did not return a status payload"; exit 1; }

          echo "Smoke check passed."

  # --- Honest run summary ----------------------------------------------------
  # Without this, a run where every deploy job was SKIPPED still shows a green
  # tick, which reads as "deployed". This states plainly what did and did not
  # happen, on every single run.
  summary:
    name: Pipeline summary
    runs-on: ubuntu-latest
    needs: [quality-gates, type-check, build-image, push-image, migration-check, migrate, deploy, smoke]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Write summary
        env:
          ENABLED: ${{ vars.DEPLOY_ENABLED }}
          GATES: ${{ needs.quality-gates.result }}
          TYPES: ${{ needs.type-check.result }}
          BUILD: ${{ needs.build-image.result }}
          PUSH: ${{ needs.push-image.result }}
          CHECK: ${{ needs.migration-check.result }}
          PENDING: ${{ needs.migration-check.outputs.migrate }}
          PENDING_REASON: ${{ needs.migration-check.outputs.reason }}
          MIGRATE: ${{ needs.migrate.result }}
          DEPLOY: ${{ needs.deploy.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          {
            echo "## Production pipeline"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Quality gates (lint/unit/e2e) | ${GATES} |"
            echo "| Type-check (all packages) | ${TYPES} |"
            echo "| Build + verify image | ${BUILD} |"
            echo "| Push image | ${PUSH} |"
            echo "| Detect pending migrations | ${CHECK} (migrate=${PENDING:-unknown}: ${PENDING_REASON:-no reason reported}) |"
            echo "| Migrate database | ${MIGRATE} |"
            echo "| Deploy to Rapids | ${DEPLOY} |"
            echo "| Post-deploy smoke | ${SMOKE} |"
            echo ""
            # Order matters. A BROKEN BUILD is the headline even when deploys are
            # switched off — the original version branched only on ENABLED, so a run
            # whose gates had actually FAILED still printed the reassuring
            # "expected pre-launch state" banner. The one job written to keep this
            # pipeline honest was reassuring on a red build (code review 2026-09-03).
            if [ "${GATES}" = "failure" ] || [ "${TYPES}" = "failure" ] || [ "${BUILD}" = "failure" ]; then
              echo "> ❌ **THE BUILD IS BROKEN.** A pre-deploy stage failed above, so nothing"
              echo "> could have been deployed regardless of the \`DEPLOY_ENABLED\` setting."
              echo "> Fix the failing stage first — do not read this run as a quiet no-op."
            elif [ "${ENABLED}" = "true" ]; then
              if [ "${SMOKE}" = "success" ] && [ "${MIGRATE}" = "skipped" ]; then
                echo "> ✅ Deployed and smoke-checked. Migrations were skipped: ${PENDING_REASON}."
              elif [ "${SMOKE}" = "success" ]; then
                echo "> ✅ Deployed and smoke-checked."
              else
                echo "> ❌ **Deploy did not complete cleanly.** Check the failed stage above and"
                echo "> follow the rollback procedure in \`.github/DEPLOY_RUNBOOK.md\`."
              fi
            elif [ -n "${ENABLED}" ] && [ "${ENABLED}" != "false" ]; then
              # Set, but not to a value that enables anything. Without this branch a
              # typo ("True", "1", "yes") is indistinguishable from a deliberate off.
              echo "> ⚠️ **\`DEPLOY_ENABLED\` is set to \`${ENABLED}\`, which is NOT the exact string"
              echo "> \`true\`, so nothing was deployed.** If you meant to enable deploys, set it to"
              echo "> lowercase \`true\`. If you meant to keep them off, unset it or use \`false\`."
            else
              echo "> ⏸️ **NOTHING WAS DEPLOYED.** The \`DEPLOY_ENABLED\` repository variable is not"
              echo "> \`true\`, so the migrate/deploy/smoke jobs were skipped. This is the expected"
              echo "> pre-launch state: the DanubeData account does not exist yet."
              echo "> See \`.github/DEPLOY_RUNBOOK.md\` for the enablement checklist."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
