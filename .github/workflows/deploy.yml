name: Deploy (production)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy. Defaults to this run''s commit SHA. Set to an earlier SHA to ROLL BACK.'
        required: false
        type: string

# Never cancel a deploy in flight: a run cancelled between migrate and deploy
# leaves the database ahead of the code.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  IMAGE_NAME: budget-planner-web
  # Pinned: migrate and deploy rely on exact CLI behaviour (`apply --wait`).
  DANUBE_CLI_VERSION: '1.3.0'

jobs:
  # A `needs:` on the reusable workflow, not workflow_run (which also fires on
  # failure), so "a red build never deploys" is structural.
  quality-gates:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  # Use `pnpm --filter <pkg> type-check`: the root tsc:* scripts exit without running a compiler.
  type-check:
    name: Type-check (tsc, all packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # No `version:` here: it conflicts with package.json `packageManager`.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc reads workspace packages via project references (built .d.ts) and needs the
      # generated route tree; both are gitignored, so build them first.
      - name: Build workspace packages (project references)
        run: pnpm build:packages

      # A real build is the only supported way to generate src/routeTree.gen.ts.
      - name: Build the web app (generates src/routeTree.gen.ts)
        run: pnpm --filter web build

      # One step per package so a failure names the package.
      - name: Type-check web
        run: pnpm --filter web type-check

      - name: Type-check core
        run: pnpm --filter @budget-planner/core type-check

      - name: Type-check db
        run: pnpm --filter @budget-planner/db type-check

      - name: Type-check config
        run: pnpm --filter @budget-planner/config type-check

  # No `needs:`: runs alongside the gates, which is safe only because it reads no
  # secrets and never pushes. push-image, which needs every gate, pushes these bytes.
  build-image:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not for secrets: VITE_COUNTERDEV_ID has a different value at production scope,
    # and that is the one that must ship.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VITE_* vars are inlined at build time, so they must be build args, not runtime env.
      - name: Build production image
        env:
          VITE_COUNTERDEV_ID: ${{ vars.VITE_COUNTERDEV_ID }}
          VITE_FORMSPARK_FORM_ID: ${{ vars.VITE_FORMSPARK_FORM_ID }}
        run: |
          set -euo pipefail
          docker build \
            -f apps/web/Dockerfile \
            --build-arg "VITE_COUNTERDEV_ID=${VITE_COUNTERDEV_ID}" \
            --build-arg "VITE_FORMSPARK_FORM_ID=${VITE_FORMSPARK_FORM_ID}" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      # Fail here, not at the push: the registry bills each tag's compressed size, and an
      # oversized image would otherwise only die after every gate had run.
      - name: Check the image size budget
        run: |
          set -euo pipefail
          docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}" --format 'uncompressed .Size: {{.Size}} B'
          # The base is pulled only to label which layers are base vs app.
          docker pull -q node:24-slim > /dev/null
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" | python3 .github/scripts/image_size.py --base node:24-slim

      - name: Verify the image serves and migrates
        run: bash .github/scripts/verify-image.sh "${IMAGE_NAME}:${GITHUB_SHA}" packages/db/migrations/meta/_journal.json

      - name: Export the verified image
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" | zstd -T0 -3 -q -o image.tar.zst
          ls -lh image.tar.zst

      - name: Upload the verified image
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: image.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  push-image:
    name: Push container image
    runs-on: ubuntu-latest
    needs: [quality-gates, type-check, build-image]
    # Main only: this job prunes and pushes, so a branch dispatch must not reach it.
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 15
    # Environment-scoped registry secrets resolve to empty without this key.
    environment: production
    steps:
      # Needed for `packageManager` in package.json, which pnpm/action-setup reads.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the verified image
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load the verified image
        run: |
          set -euo pipefail
          zstd -dc image.tar.zst | docker load
          docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}" > /dev/null

      # Set up before the push: the prune step runs first and needs the CLI.
      - name: Set up pnpm
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install DanubeData CLI
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: pnpm add -g "@danubedata/cli@${{ env.DANUBE_CLI_VERSION }}"

      # Report-only: quota usage and per-tag billed size around the prune and push.
      - name: Registry usage before prune
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        continue-on-error: true
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
          REGISTRY: ${{ vars.DANUBEDATA_REGISTRY }}
        run: bash .github/scripts/registry-report.sh "before prune"

      # Runs before the push so a registry already at quota self-heals. Rollback needs
      # earlier tags, and raising KEEP_TAGS breaks the image size budget.
      - name: Prune old image tags
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        continue-on-error: true
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
          REGISTRY: ${{ vars.DANUBEDATA_REGISTRY }}
          KEEP_TAGS: ${{ vars.REGISTRY_KEEP_TAGS }}
        run: |
          set -euo pipefail
          # REGISTRY is host + namespace; the repository path drops the host.
          REPO="${REGISTRY#*/}/${IMAGE_NAME}"

          # 0 would delete every rollback target; a non-integer would silently
          # disable pruning under continue-on-error.
          KEEP="${KEEP_TAGS:-2}"
          case "${KEEP}" in
            ''|*[!0-9]*)
              echo "::error::REGISTRY_KEEP_TAGS must be a non-negative integer, got '${KEEP}'."
              exit 1
              ;;
          esac
          if [ "${KEEP}" -lt 1 ]; then
            echo "::warning::REGISTRY_KEEP_TAGS=${KEEP} would leave no rollback target; clamping to 1."
            KEEP=1
          fi
          echo "Keeping the ${KEEP} newest tags in ${REPO}"

          # Never prune a deployed tag: a Knative revision is pinned to its image and cannot
          # cold-start once it is gone. Fails closed if the deployed tags cannot be read.
          if ! deployed=$(danube --json rapids ls | python3 .github/scripts/rapids_deployed_tags.py); then
            echo "::warning::Could not determine which tags are deployed; skipping the prune entirely."
            echo "A tag pruned while a container runs it takes the site down on its next cold start."
            exit 0
          fi
          printf 'Deployed tags (never pruned): %s\n' "${deployed:-none}"
          printf '%s\n' "${deployed}" > /tmp/deployed-tags.txt

          danube --json registry repos tags "${REPO}" > /tmp/tags.json

          doomed=$(KEEP="${KEEP}" KEEPSHA="${GITHUB_SHA}" python3 - <<'PY'
          import json, os, sys

          # The CLI's --json mode double-wraps the payload: tags are at .data.data.
          keep = int(os.environ["KEEP"])
          keepsha = os.environ["KEEPSHA"]
          envelope = json.load(open("/tmp/tags.json"))
          inner = envelope.get("data")
          rows = inner.get("data") if isinstance(inner, dict) else inner
          if not isinstance(rows, list):
              sys.exit(
                  "registry repos tags returned an unexpected shape (expected "
                  f"data.data to be a list, got {type(rows).__name__}): "
                  f"{json.dumps(envelope)[:500]}"
              )
          # A paginated listing would hide the oldest tags; warn rather than under-prune.
          page_meta = inner if isinstance(inner, dict) else {}
          if any(k in page_meta for k in ("next", "next_cursor", "cursor", "page", "total")):
              print(
                  "::warning::registry tag listing looks paginated; prune may only "
                  "cover the first page — verify the CLI response shape",
                  file=sys.stderr,
              )
          try:
              with open("/tmp/deployed-tags.txt", encoding="utf-8") as fh:
                  deployed = {line.strip() for line in fh if line.strip()}
          except OSError:
              sys.exit("deployed-tag list missing; refusing to prune")

          rows.sort(key=lambda r: r.get("pushed_at") or "", reverse=True)
          for r in rows[keep:]:
              tag = r.get("tag")
              if not tag or tag == keepsha:
                  continue
              if tag in deployed:
                  print(f"::notice::keeping {tag} — a container is deployed from it", file=sys.stderr)
                  continue
              print(tag)
          PY
          )

          if [ -z "${doomed}" ]; then
            echo "Nothing to prune."
            exit 0
          fi

          # Here-string, not a pipe: a child reading stdin would swallow the remaining tags.
          while read -r tag; do
            [ -n "${tag}" ] || continue
            echo "Deleting ${REPO}:${tag}"
            danube registry repos rm-tag "${REPO}" "${tag}" --force < /dev/null
          done <<< "${doomed}"

          danube registry usage || true

      - name: Registry usage after prune
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        continue-on-error: true
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
          REGISTRY: ${{ vars.DANUBEDATA_REGISTRY }}
        run: bash .github/scripts/registry-report.sh "after prune"

      - name: Push image to the DanubeData registry
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        env:
          REGISTRY: ${{ vars.DANUBEDATA_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.DANUBEDATA_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DANUBEDATA_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY:-}" ]; then
            echo "::error::DEPLOY_ENABLED is true but the DANUBEDATA_REGISTRY variable is unset."
            echo "Set it to the registry path from provisioning (Story 4-16/5-2) before enabling deploys."
            exit 1
          fi
          case "${REGISTRY}" in
            */)      echo "::error::DANUBEDATA_REGISTRY must not end with '/': '${REGISTRY}'"; exit 1 ;;
            *://*)   echo "::error::DANUBEDATA_REGISTRY must not include a scheme: '${REGISTRY}'"; exit 1 ;;
            *\ *)    echo "::error::DANUBEDATA_REGISTRY must not contain spaces: '${REGISTRY}'"; exit 1 ;;
          esac
          # docker login takes the host only.
          REGISTRY_HOST="${REGISTRY%%/*}"
          echo "Logging in to ${REGISTRY_HOST}"
          echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY_HOST}" -u "${REGISTRY_USERNAME}" --password-stdin
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

      # Also after a failed push: a quota denial is the run worth measuring.
      - name: Registry usage after push
        if: ${{ !cancelled() && vars.DEPLOY_ENABLED == 'true' }}
        continue-on-error: true
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
          REGISTRY: ${{ vars.DANUBEDATA_REGISTRY }}
        run: bash .github/scripts/registry-report.sh "after push"

  # Baseline is the last run whose deploy job succeeded, not event.before (failed or
  # replaced runs). Every path that cannot prove "no change" migrates.
  migration-check:
    name: Detect pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      migrate: ${{ steps.detect.outputs.migrate }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout (full history, to diff against the last deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare migrations against the last successful deploy
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
          # Must match the deploy job's `name:` exactly.
          DEPLOY_JOB_NAME: Deploy to DanubeData Rapids
          MIGRATION_PATHS: packages/db/migrations packages/db/drizzle.config.ts
        run: |
          set -uo pipefail
          decide() {
            echo "migrate=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
            echo "::notice::migrate=$1 — $2"
            exit 0
          }

          [ "${EVENT_NAME}" = "push" ] || decide true "manual dispatch always migrates"

          runs=$(gh api "repos/${REPO}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=30" \
            --jq '.workflow_runs[] | "\(.id) \(.head_sha)"') \
            || decide true "could not list previous deploy runs"

          base=""
          while read -r id sha; do
            [ -n "${id}" ] || continue
            [ "${id}" != "${CURRENT_RUN}" ] || continue
            deployed=$(gh api "repos/${REPO}/actions/runs/${id}/jobs?per_page=100" \
              --jq "[.jobs[] | select(.name == \"${DEPLOY_JOB_NAME}\" and .conclusion == \"success\")] | length" < /dev/null) \
              || decide true "could not read the jobs of run ${id}"
            if [ "${deployed}" -gt 0 ]; then
              base="${sha}"
              break
            fi
          done <<< "${runs}"

          [ -n "${base}" ] || decide true "no previous successful deploy in the last 30 successful runs"
          git cat-file -e "${base}^{commit}" 2>/dev/null \
            || decide true "last deployed commit ${base} is not in this history"

          # `|| status=$?`: the runner injects `bash -e`, and diff exits 1 to mean "changed".
          status=0
          # shellcheck disable=SC2086 # MIGRATION_PATHS is a deliberate word list
          git diff --quiet "${base}" "${GITHUB_SHA}" -- ${MIGRATION_PATHS} || status=$?
          case ${status} in
            0) decide false "no migration changes since the last deployed commit ${base}" ;;
            1) decide true "migrations changed since the last deployed commit ${base}" ;;
            *) decide true "git diff against ${base} failed" ;;
          esac

  # Runs in-cluster as a Rapids container in migrate mode. Readiness is not the
  # verdict: only an explicit `succeeded` from /migrate-status passes.
  migrate:
    name: Migrate production database
    runs-on: ubuntu-latest
    needs: [push-image, migration-check]
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && needs.migration-check.outputs.migrate == 'true' }}
    environment: production
    # Tight: the non-cancelling concurrency group queues later deploys behind a stuck run.
    timeout-minutes: 20
    env:
      # Fixed name so a crashed run's leftover is reused, not orphaned with credentials.
      MIGRATE_CONTAINER: budget-planner-migrator
      # Must match EU_DB_INTERNAL_HOSTS in the db client, which refuses any other host.
      DB_INTERNAL_HOST: budget-planner-prod-rw.budgetplanner795.svc.cluster.local
      DB_INTERNAL_PORT: '5432'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the DanubeData CLI
        run: pnpm add -g "@danubedata/cli@${{ env.DANUBE_CLI_VERSION }}"

      - name: Authenticate the DanubeData CLI
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
        run: danube whoami

      # Threshold 0, unlike the weekly job's 21 days: a deploy blocks only on a
      # certificate that is already expired or unparseable.
      - name: Verify the database CA certificate is usable
        env:
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          CA_EXPIRY_WARN_DAYS: '0'
        run: pnpm --filter @budget-planner/db db:ca-expiry

      # The migrate container is publicly routable, so its status endpoint needs a per-run token.
      - name: Mint the migration status token
        id: token
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Compose the in-cluster DATABASE_URL
        id: dburl
        env:
          DB_USER: ${{ vars.DATABASE_MIGRATOR_USER }}
          DB_PASSWORD: ${{ secrets.DATABASE_MIGRATOR_PASSWORD }}
          DB_NAME: ${{ vars.DATABASE_NAME }}
        run: |
          set -euo pipefail
          for var in DB_USER DB_PASSWORD DB_NAME; do
            if [ -z "${!var:-}" ]; then
              echo "::error::${var} is not set. See DEPLOY_RUNBOOK.md §1 for the required repo variable/secret."
              exit 1
            fi
          done

          database_url=$(python3 -c "
          import os
          from urllib.parse import quote
          user = quote(os.environ['DB_USER'], safe='')
          password = quote(os.environ['DB_PASSWORD'], safe='')
          host = os.environ['DB_INTERNAL_HOST']
          port = os.environ['DB_INTERNAL_PORT']
          print(f\"postgresql://{user}:{password}@{host}:{port}/{os.environ['DB_NAME']}\")
          ")
          echo "::add-mask::${database_url}"
          echo "url=${database_url}" >> "$GITHUB_OUTPUT"
          echo "::notice::Migrating over internal DNS (${DB_INTERNAL_HOST}:${DB_INTERNAL_PORT}). No public endpoint is opened."

      # One call, not apply + update: an update landing while the previous one still rolls
      # out is accepted and silently dropped. `--wait` waits for this call's generation.
      - name: Start the migration (create-or-update in one call)
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ vars.DANUBEDATA_REGISTRY }}
          RESOURCE_PROFILE: ${{ vars.RAPIDS_RESOURCE_PROFILE || 'small' }}
          IDEMPOTENCY_KEY: migrate-${{ github.run_id }}-${{ github.run_attempt }}
          DATABASE_URL: ${{ steps.dburl.outputs.url }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          STATUS_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Never add --json here: the printed container carries env values, DATABASE_URL included.
          danube rapids apply \
            --name "${MIGRATE_CONTAINER}" \
            --image "${REGISTRY}/${IMAGE_NAME}" \
            --tag "${IMAGE_TAG}" \
            --port 8080 \
            --health-check-path /healthz \
            --profile "${RESOURCE_PROFILE}" \
            --min-scale 1 \
            --max-scale 1 \
            --env \
              "APP_ENTRYPOINT=migrate" \
              "NODE_ENV=production" \
              "DATABASE_URL=${DATABASE_URL}" \
              "DATABASE_CA_CERT=${DATABASE_CA_CERT}" \
              "MIGRATE_STATUS_TOKEN=${STATUS_TOKEN}" \
              "MIGRATE_RUN_ID=${RUN_ID}" \
            --idempotency-key "${IDEMPOTENCY_KEY}" \
            --wait \
            --wait-timeout 10m
          echo "::notice::Migrate container is live with this run's configuration. Polling for a verdict."

      # The --json listing carries env values; only the url field is ever printed.
      - name: Resolve the migrate container URL
        id: url
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
        run: |
          # No `set -e`: each attempt absorbs its own failure and the retry loop decides.
          set -uo pipefail
          url=""
          for i in $(seq 1 12); do
            listing=$(danube --json rapids ls 2>/dev/null) || listing=""
            if [ -n "${listing}" ]; then
              url=$(printf '%s' "${listing}" | python3 -c "
          import json, os, sys
          try:
              rows = json.load(sys.stdin).get('data') or []
          except Exception:
              rows = []
          row = next((r for r in rows if isinstance(r, dict) and r.get('name') == os.environ['MIGRATE_CONTAINER']), None)
          print((row or {}).get('url') or '')
          " 2>/dev/null) || url=""
            fi
            if [ -n "${url}" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "${url}" ]; then
            echo "::error::${MIGRATE_CONTAINER} never reported a URL within 60s."
            exit 1
          fi
          echo "::notice::Migrate container URL: ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # Fails closed on anything other than an explicit `succeeded` for this run id.
      - name: Wait for the migration verdict
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
          STATUS_TOKEN: ${{ steps.token.outputs.token }}
          CONTAINER_URL: ${{ steps.url.outputs.url }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          deadline=$(( SECONDS + 600 ))
          state="(never reached)"
          body=""
          last_error="(no attempt completed)"

          while [ "${SECONDS}" -lt "${deadline}" ]; do
            # -L: the listed URL is http:// and the edge 301s to https. An empty 200 is
            # not a verdict.
            if body=$(curl -fsSL --max-time 15 \
                -H "Authorization: Bearer ${STATUS_TOKEN}" \
                "${CONTAINER_URL%/}/migrate-status" 2>/tmp/curl-err) && [ -n "${body}" ]; then
              parsed=$(printf '%s' "${body}" | python3 -c "
          import json, sys
          try:
              payload = json.load(sys.stdin)
              print(payload.get('state', 'unparseable'), payload.get('runId', ''))
          except Exception:
              print('unparseable', '')
          ") || parsed="unparseable "
              state="${parsed%% *}"
              reported_run="${parsed#* }"

              # A verdict from a container this run did not start is ignored.
              if [ "${reported_run}" != "${RUN_ID}" ]; then
                last_error="reported runId '${reported_run}' != this run '${RUN_ID}'"
                state="(foreign container)"
              elif [ "${state}" != "running" ]; then
                break
              fi
            else
              # Distinguish a curl failure from an empty response (an unfollowed redirect).
              curl_err="$(tr -d '\n' < /tmp/curl-err 2>/dev/null)" || curl_err=""
              if [ -n "${curl_err}" ]; then
                last_error="curl: ${curl_err}"
              else
                last_error="empty response from ${CONTAINER_URL%/}/migrate-status (redirect not followed, or no body)"
              fi
            fi

            # Second channel: Knative may route the URL to a newer revision than the one
            # that migrated, but logs aggregate across revisions.
            log_verdict=$(danube --json rapids logs "${MIGRATE_CONTAINER}" --since 1h --limit 500 2>/dev/null \
              | python3 .github/scripts/rapids_verdict.py "${RUN_ID}") || log_verdict="error"
            case "${log_verdict}" in
              succeeded)
                echo "::notice::Verdict read from the container logs for run ${RUN_ID}."
                state="succeeded"
                break
                ;;
              failed:*)
                echo "::error::Logs report this run's migration failed (${log_verdict#failed:})."
                state="failed"
                break
                ;;
              error)
                # Not fatal: the HTTP channel may still answer.
                last_error="${last_error}; logs unreadable"
                ;;
            esac

            sleep 10
          done

          echo "::notice::Terminal state: ${state}"

          if [ "${state}" = "succeeded" ]; then
            echo "Migration applied in-cluster. No public endpoint was opened."
            exit 0
          fi

          echo "::error::Migration did not succeed (state: ${state}). Aborting the release before deploy."
          echo "Last transport error: ${last_error}"
          echo "--- status body ---"
          printf '%s\n' "${body:-(no response)}"
          echo "--- revisions ---"
          danube rapids revisions "${MIGRATE_CONTAINER}" || true
          echo "--- events ---"
          danube rapids events "${MIGRATE_CONTAINER}" || true
          echo "--- logs ---"
          danube rapids logs "${MIGRATE_CONTAINER}" --since 30m --limit 200 || true
          exit 1

      # Never delete the container: scale to zero, strip its credentials, and verify the strip
      # as a word (clean/dirty/error), since an exit code cannot say "could not tell".
      - name: Scale down and strip the migrate container's credentials
        if: ${{ always() }}
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
        run: |
          set -uo pipefail
          SECRET_KEYS="DATABASE_URL DATABASE_CA_CERT MIGRATE_STATUS_TOKEN MIGRATE_RUN_ID"

          # May run before the container exists; the state check below decides.
          # shellcheck disable=SC2086 # SECRET_KEYS is a deliberate word list
          danube rapids update "${MIGRATE_CONTAINER}" \
            --rm-env ${SECRET_KEYS} \
            --min-scale 0 \
            --wait \
            --wait-timeout 5m \
            || echo "rapids update returned non-zero; verifying actual state instead"

          verdict="error"
          for i in $(seq 1 12); do
            listing=$(danube --json rapids ls 2>/dev/null) || listing=""
            # shellcheck disable=SC2086 # SECRET_KEYS is a deliberate word list
            verdict=$(printf '%s' "${listing}" \
              | python3 .github/scripts/rapids_env_check.py "${MIGRATE_CONTAINER}" ${SECRET_KEYS}) \
              || verdict="error"
            if [ "${verdict}" = "clean" ]; then
              echo "::notice::Migrate container scaled to zero; credentials stripped."
              exit 0
            fi
            sleep 5
          done

          if [ "${verdict}" = "error" ]; then
            echo "::error::Could not establish whether ${MIGRATE_CONTAINER} still holds credentials — the listing was unreadable."
            echo "Treating this as STILL HOLDING them."
          else
            echo "::error::${MIGRATE_CONTAINER} still holds credentials after 60s (${verdict})."
          fi
          echo "Strip them by hand: danube rapids update ${MIGRATE_CONTAINER} --rm-env ${SECRET_KEYS} --min-scale 0"
          exit 1

  deploy:
    name: Deploy to DanubeData Rapids
    runs-on: ubuntu-latest
    needs: [push-image, migration-check, migrate]
    # `!cancelled()` allows a skipped migrate only when the check positively reported
    # nothing to apply. Never loosen to `always()`.
    if: >-
      ${{ !cancelled()
      && vars.DEPLOY_ENABLED == 'true'
      && github.ref == 'refs/heads/main'
      && needs.push-image.result == 'success'
      && (needs.migrate.result == 'success'
      || (needs.migrate.result == 'skipped'
      && needs.migration-check.result == 'success'
      && needs.migration-check.outputs.migrate == 'false')) }}
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A manual dispatch may name an older SHA — that is the rollback path.
      - name: Resolve image tag
        id: resolve
        env:
          REQUESTED: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED:-$GITHUB_SHA}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: ${TAG}"

      # No `pnpm install`: this job runs no workspace script.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install DanubeData CLI
        run: pnpm add -g "@danubedata/cli@${{ env.DANUBE_CLI_VERSION }}"

      - name: Verify CLI authentication
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
        run: |
          set -euo pipefail
          danube whoami

      # preflight takes the full image:tag reference, unlike apply's --image/--tag split.
      - name: Preflight the image
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          REGISTRY: ${{ vars.DANUBEDATA_REGISTRY }}
        run: |
          set -euo pipefail
          danube rapids preflight --image "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

      # --wait: otherwise the step exits on acceptance and smoke measures the old revision.
      # Env vars, timeouts and resources have no CLI flag; they are set at provisioning.
      - name: Deploy revision to Rapids
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBE_TOKEN }}
          DANUBE_TEAM_ID: ${{ vars.DANUBE_TEAM_ID }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          REGISTRY: ${{ vars.DANUBEDATA_REGISTRY }}
          # run_id alone is stable across re-runs, which would replay a cached outcome.
          IDEMPOTENCY_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          # Required on create. Not `free`: too little memory, and it caps max-scale at 3.
          RESOURCE_PROFILE: ${{ vars.RAPIDS_RESOURCE_PROFILE || 'small' }}
        run: |
          set -euo pipefail
          echo "Rolling out ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} to Rapids (Falkenstein, DE)"
          danube rapids apply \
            --name "${IMAGE_NAME}" \
            --image "${REGISTRY}/${IMAGE_NAME}" \
            --tag "${IMAGE_TAG}" \
            --port 8080 \
            --health-check-path /api/health \
            --profile "${RESOURCE_PROFILE}" \
            --min-scale 0 \
            --max-scale 5 \
            --idempotency-key "${IDEMPOTENCY_KEY}" \
            --wait \
            --wait-timeout 10m

  smoke:
    name: Post-deploy smoke check
    runs-on: ubuntu-latest
    needs: deploy
    # Explicit result check: a skipped migrate would make the implicit success() skip this.
    if: ${{ !cancelled() && vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success' }}
    timeout-minutes: 10
    steps:
      - name: Smoke-check the live site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ]; then
            echo "::error::SITE_URL repository variable is unset; cannot smoke-check the deploy."
            exit 1
          fi

          SITE_URL="${SITE_URL%/}"
          echo "Smoke-checking ${SITE_URL}"

          code=$(curl -fsS -o /tmp/home.html -w '%{http_code}' --max-time 30 "${SITE_URL}/")
          echo "GET /            -> ${code}"
          grep -qi '<html' /tmp/home.html \
            || { echo "::error::/ returned ${code} but the body is not an HTML document"; exit 1; }

          # A server route proves this is the SSR server, not a stale static shell.
          health=$(curl -fsS --max-time 30 "${SITE_URL}/api/health")
          echo "GET /api/health  -> ${health}"
          echo "${health}" | grep -q '"status"' \
            || { echo "::error::/api/health did not return a status payload"; exit 1; }

          echo "Smoke check passed."

  # Without this, a run whose deploy jobs were all skipped still shows green.
  summary:
    name: Pipeline summary
    runs-on: ubuntu-latest
    needs: [quality-gates, type-check, build-image, push-image, migration-check, migrate, deploy, smoke]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Write summary
        env:
          ENABLED: ${{ vars.DEPLOY_ENABLED }}
          GATES: ${{ needs.quality-gates.result }}
          TYPES: ${{ needs.type-check.result }}
          BUILD: ${{ needs.build-image.result }}
          PUSH: ${{ needs.push-image.result }}
          CHECK: ${{ needs.migration-check.result }}
          PENDING: ${{ needs.migration-check.outputs.migrate }}
          PENDING_REASON: ${{ needs.migration-check.outputs.reason }}
          MIGRATE: ${{ needs.migrate.result }}
          DEPLOY: ${{ needs.deploy.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          {
            echo "## Production pipeline"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Quality gates (lint/unit/e2e) | ${GATES} |"
            echo "| Type-check (all packages) | ${TYPES} |"
            echo "| Build + verify image | ${BUILD} |"
            echo "| Push image | ${PUSH} |"
            echo "| Detect pending migrations | ${CHECK} (migrate=${PENDING:-unknown}: ${PENDING_REASON:-no reason reported}) |"
            echo "| Migrate database | ${MIGRATE} |"
            echo "| Deploy to Rapids | ${DEPLOY} |"
            echo "| Post-deploy smoke | ${SMOKE} |"
            echo ""
            # A broken build outranks the "deploys are off" banner.
            if [ "${GATES}" = "failure" ] || [ "${TYPES}" = "failure" ] || [ "${BUILD}" = "failure" ]; then
              echo "> ❌ **THE BUILD IS BROKEN.** A pre-deploy stage failed above, so nothing"
              echo "> could have been deployed regardless of the \`DEPLOY_ENABLED\` setting."
              echo "> Fix the failing stage first — do not read this run as a quiet no-op."
            elif [ "${ENABLED}" = "true" ]; then
              if [ "${SMOKE}" = "success" ] && [ "${MIGRATE}" = "skipped" ]; then
                echo "> ✅ Deployed and smoke-checked. Migrations were skipped: ${PENDING_REASON}."
              elif [ "${SMOKE}" = "success" ]; then
                echo "> ✅ Deployed and smoke-checked."
              else
                echo "> ❌ **Deploy did not complete cleanly.** Check the failed stage above and"
                echo "> follow the rollback procedure in \`.github/DEPLOY_RUNBOOK.md\`."
              fi
            elif [ -n "${ENABLED}" ] && [ "${ENABLED}" != "false" ]; then
              # A typo ("True", "1") must not read as a deliberate off.
              echo "> ⚠️ **\`DEPLOY_ENABLED\` is set to \`${ENABLED}\`, which is NOT the exact string"
              echo "> \`true\`, so nothing was deployed.** If you meant to enable deploys, set it to"
              echo "> lowercase \`true\`. If you meant to keep them off, unset it or use \`false\`."
            else
              echo "> ⏸️ **NOTHING WAS DEPLOYED.** The \`DEPLOY_ENABLED\` repository variable is not"
              echo "> \`true\`, so the migrate/deploy/smoke jobs were skipped. This is the expected"
              echo "> pre-launch state: the DanubeData account does not exist yet."
              echo "> See \`.github/DEPLOY_RUNBOOK.md\` for the enablement checklist."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
